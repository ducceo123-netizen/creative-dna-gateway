name: Gateway UI Validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/onepage-panel.*'
      - 'public/onepage-review*'
      - 'uid-onepage-html-preview.ts'
      - 'uid-hosted-review*.ts'
      - 'scripts/*hosted-review.ts'
      - 'public/reviews/**'
      - 'uid-brands-chat.ts'
      - 'uid-brands-feedback-index.ts'
      - 'uid-brands-progress.ts'
      - 'uid-brands-ui-resource.ts'
      - 'vercel.json'
      - 'uid-brands-workflow.ts'
      - 'uid-brands-actions.ts'
      - 'uid-brands-review-contract.ts'
      - 'uid-brands-attachment-ui.ts'
      - 'uid-brands-attachments.ts'
      - 'server.ts'
      - 'uid-muse.ts'
      - 'onepage-ui-template.ts'
      - 'uid-asset-preflight.ts'
      - 'uid-brand-colors.ts'
      - 'scripts/quality/**'
      - 'scripts/preflight-creative-package.ts'
      - 'package.json'
      - 'bun.lock'
      - 'uid-private-reference-*.ts'
      - 'supabase/functions/_shared/reference-library*.ts'
      - 'supabase/functions/_shared/private-reference*.ts'
      - 'supabase/functions/creative-dna-references/**'
      - 'supabase/functions/creative-dna-reference-ingest/**'
      - 'supabase/functions/_shared/creative-quality.ts'
      - 'supabase/functions/_shared/onepage-packet.ts'
      - 'supabase/functions/_shared/product-research.ts'
      - 'supabase/functions/creative-dna-public/**'
      - 'supabase/functions/creative-dna-compile-onepage/**'
      - 'tests/**'
      - '.github/workflows/gateway-ui.yml'
      - 'tools/creative-quality/**'
  push:
    branches: [main]
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun install --cwd tools/creative-quality --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run build
      - run: bun test tests/*.test.ts

      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/onepage-review.py
      - run: python tests/browser/hosted-review.py

      - run: python tests/browser/owner-review.py

      - run: python tests/browser/fixed-ui-quality.py
        env:
          FIXED_UI_ARTIFACTS: artifacts/fixed-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-ui-quality-evidence
          path: artifacts/fixed-ui
          if-no-files-found: ignore
