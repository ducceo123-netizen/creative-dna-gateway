name: Governance Validation
on:
  pull_request:
    paths:
      - 'src/governance-*.ts'
      - 'src/knowledge-governance.ts'
      - 'src/components/AdminFeedback.tsx'
      - 'src/components/GovernancePanel.tsx'
      - 'supabase/**'
      - 'tests/*governance*.ts'
      - 'tests/sql/**'
      - 'scripts/compile-agent-review-plan.mjs'
      - 'scripts/agent-review-compiler.bundle.mjs'
      - 'tests/agent-review-plan.test.ts'
      - '.github/workflows/governance.yml'
  push:
    branches: [main]
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun test tests/governance-engine.test.ts tests/knowledge-governance.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify owner schema4 adapter, Edge integration and isolated SQL parity
        run: |
          node --import tsx --test tests/owner-rule-plan.test.ts tests/owner-rule-compatible-plan.test.ts tests/uid-owner-rule-edge.test.ts tests/agent-rule-review-plan.test.ts
          npm install --prefix /tmp/uid-owner-v4-test --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.10
          UID_TEST_PGLITE_MODULE=/tmp/uid-owner-v4-test/node_modules/@electric-sql/pglite/dist/index.js node --import tsx tests/sql/uid_owner_rule_v4.mjs
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration and guarded review transactions in disposable PostgreSQL
        run: |
          psql -h localhost -U postgres -d governance_test -v ON_ERROR_STOP=1 -f tests/sql/governance_fixture.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d governance_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d governance_test -v ON_ERROR_STOP=1 -f tests/sql/governance_covered_resolution.sql
          psql -h localhost -U postgres -d governance_test -v ON_ERROR_STOP=1 -f tests/sql/uid_direct_rule_accept.sql
          psql -h localhost -U postgres -d governance_test -v ON_ERROR_STOP=1 -f tests/sql/uid_agent_review_queue.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify pinned compiler parity and transaction concurrency
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: governance_test
          UID_TEST_PG_MODULE: /tmp/uid-governance-test/node_modules/pg/lib/index.js
        run: |
          npm install --prefix /tmp/uid-governance-test --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
          node tests/sql/uid_review_preflight_context_reuse.mjs
          node tests/sql/uid_rule_normalization_cache.mjs
          node tests/sql/uid_rule_replacement_context.mjs
          node tests/sql/uid_agent_review_compiler.mjs
          node tests/sql/uid_direct_rule_accept_concurrency.mjs
          node tests/sql/uid_agent_review_queue_concurrency.mjs
