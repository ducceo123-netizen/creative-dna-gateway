<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tết Studio · Campaign Builder MVP</title><style>
:root{--bg:#f6f6f7;--paper:#fff;--ink:#202223;--sub:#6d7175;--line:#e1e3e5;--green:#008060;--dark:#004c3f;--gold:#dab36d;--red:#9b2936;--shadow:0 1px 4px #00000010}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:var(--ink);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.top{height:62px;background:#fff;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:0 24px;position:sticky;top:0;z-index:10}.logo{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;white-space:nowrap}.mark{background:#004c3f;color:#fff;padding:8px;border-radius:9px}.search{background:#f6f6f7;padding:9px 15px;border:1px solid #e1e3e5;border-radius:8px;max-width:450px;flex:1;color:#8c9196}.spacer{flex:1}.pill{background:#e4f2ef;color:#006b53;border-radius:50px;padding:5px 10px;font-size:11px;font-weight:650}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 62px)}.side{background:white;border-right:1px solid var(--line);padding:22px 13px}.nav{padding:11px 13px;border-radius:8px;color:#444;display:flex;gap:12px;align-items:center;margin:3px 0;width:100%;border:0;background:none;text-align:left;font-weight:540}.nav:hover,.nav.active{background:#e9f4f0;color:#005d46}.sidecap{font-size:11px;letter-spacing:.09em;color:#899198;font-weight:750;padding:21px 12px 7px;text-transform:uppercase}.sidebar-bottom{margin-top:45px;padding:14px;font-size:12px;line-height:1.6;color:#68716d;background:#eff5f2;border-radius:10px}.main{max-width:1320px;width:100%;margin:0 auto;padding:34px 38px 90px}.eyebrow{color:#6d7175;font-size:12px;margin:0 0 5px}.heading{font-size:26px;font-weight:750;letter-spacing:-.7px;margin:0}.sub{margin:9px 0 22px;color:var(--sub);line-height:1.5}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.btn{border-radius:8px;padding:9px 14px;border:1px solid #b8bfc3;background:white;font-weight:620;color:#30353a;box-shadow:0 1px 0 #0001}.btn:hover{background:#f5f6f6}.btn.primary{color:white;background:#008060;border-color:#006e52}.btn.primary:hover{background:#006f54}.btn.soft{background:#eaf5f1;color:#006a50;border-color:#cce7db}.btn.danger{color:#b42318}.card{background:#fff;border:1px solid #e2e3e5;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.cp{padding:22px}.card h3{margin:0 0 8px;font-size:16px}.muted{color:var(--sub)}.small{font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:23px 0}.metric{padding:20px}.metric .n{font-size:26px;font-weight:750;margin:9px 0 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:19px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.campaign{padding:18px}.campaign .k{color:#008060;font-size:11px;font-weight:700}.progress{background:#e9e9e9;height:7px;overflow:hidden;border-radius:99px;margin-top:12px}.progress div{height:100%;background:#008060}.steps{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 24px}.step{border:1px solid #d4d9d7;border-radius:8px;background:white;padding:10px 12px;font-size:12px;font-weight:620;color:#676f71}.step.active{color:#006e52;border-color:#9dd8c6;background:#eaf6f2}.step.done:before{content:'✓ ';color:#008060}.fld{display:block;font-weight:640;font-size:12px;margin:0 0 7px}.input,.textarea,.select{width:100%;background:white;border:1px solid #aeb4b8;border-radius:8px;padding:10px 12px;outline:none}.input:focus,.textarea:focus,.select:focus{border-color:#008060;box-shadow:0 0 0 2px #00806022}.textarea{min-height:110px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin:0 0 18px}.well{background:#f7f8f8;border:1px solid #e4e8e6;border-radius:9px;padding:15px}.choice{border:1px solid #d8ddda;border-radius:12px;padding:13px;cursor:pointer;background:white}.choice.selected{border:2px solid #008060;background:#f7fffa;padding:12px}.choice:hover{box-shadow:0 2px 8px #00000012}.choice strong{display:block;margin:9px 0 5px}.choice .hint{font-size:12px;color:#687278;line-height:1.5}.swatch{height:105px;border-radius:8px;position:relative;overflow:hidden}.swatch::before{content:'Tết 2027';position:absolute;left:16px;top:21px;font:italic 24px Georgia;color:#ffe8b7}.swatch::after{content:'The Year We Built Together';position:absolute;left:16px;top:60px;font:13px Georgia;color:#fff3d1}.premium{background:linear-gradient(120deg,#651a29,#a92c35 60%,#cf9847)}.journey{background:linear-gradient(120deg,#102f28,#27695c 60%,#cba765)}.playful{background:linear-gradient(120deg,#b63843,#f39f59 65%,#fedf8e)}.artpreview{display:flex;gap:18px;background:#fff9ec;border:1px solid #e8decd;border-radius:12px;padding:16px;align-items:center}.standee{height:210px;width:185px;position:relative;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.figure{width:150px;height:160px;clip-path:polygon(18% 0,84% 0,100% 24%,96% 91%,75% 100%,20% 98%,0 80%,2% 22%);background:linear-gradient(155deg,#fff3d7,#f7bc7e,#c65a58);border:5px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 20px #0002}.avatar{font-size:55px;line-height:1}.hat{font-size:25px;line-height:1}.wood{margin-top:-2px;background:linear-gradient(#d7b17a,#a87d48);padding:7px 22px;border-radius:5px;color:#41250f;font-weight:750;font-size:12px;box-shadow:0 5px 4px #0002;z-index:1;max-width:175px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.boxmock{max-width:740px;background:#851e2e;padding:10px;border-radius:12px;box-shadow:0 14px 30px #43161633}.lid{background:linear-gradient(130deg,#fff1d7,#ffe1ad);min-height:120px;border:4px solid #a04542;padding:25px;text-align:center;color:#762131}.lid strong{font:italic 26px Georgia}.lid p{font-size:12px;margin:9px 0 0}.tray{display:grid;grid-template-columns:1.4fr 1fr;gap:9px;padding:9px}.bay{padding:10px;border:2px solid #d8a467;background:#f4d2a3;border-radius:8px;min-height:183px;text-align:center}.treats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.treat{background:#fff7e6;border-radius:9px;border:1px solid #caab80;padding:12px 3px;font-size:12px}.treat b{font-size:27px;display:block;margin-bottom:4px}.tag{display:inline-block;padding:3px 9px;border-radius:7px;background:#e8f3ed;color:#0b6b4d;font-size:11px;font-weight:650}.tag.gray{background:#f0f0f0;color:#666}.tag.warn{background:#fff3d3;color:#885d08}.tablewrap{overflow-x:auto}.table{border-collapse:collapse;width:100%;font-size:13px}.table th{background:#f9fafb;color:#5c6267;text-align:left;font-size:12px;font-weight:660}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7e8;vertical-align:middle}.table tr:hover td{background:#fafbfa}.table input{width:100%;border:1px solid transparent;background:transparent;padding:7px;border-radius:5px;min-width:80px}.table input:focus{border:1px solid #008060;background:#fff;outline:none}.table select{padding:6px;border:1px solid #dadfda;border-radius:6px;background:white}.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}.info{border-left:4px solid #008060;background:#eff8f4;padding:12px 16px;border-radius:5px;color:#255b4b;font-size:12px;line-height:1.6}.notice{border-left:4px solid #df9b22;background:#fff6dd;padding:12px 16px;border-radius:5px;color:#745215;font-size:12px;line-height:1.5}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:8px 14px;background:white;border:1px solid #c5cbca;border-radius:8px}.seg .picked{background:#e5f3ed;border-color:#008060;color:#006d4f;font-weight:700}.modalbg{position:fixed;inset:0;background:#0008;display:flex;justify-content:center;align-items:center;padding:20px;z-index:99}.modal{width:min(600px,95vw);background:white;border-radius:12px;padding:25px;box-shadow:0 12px 40px #0003;max-height:90vh;overflow:auto}.hidden{display:none!important}.divider{border:0;border-top:1px solid #e5e8e6;margin:20px 0}.toast{position:fixed;bottom:25px;right:30px;background:#244d42;color:white;padding:13px 20px;z-index:100;border-radius:9px;box-shadow:0 8px 20px #0003}.topright{font-size:12px;color:#6b7374}.help{background:#f1f6f5;border-radius:10px;padding:14px;line-height:1.7}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.intro{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:stretch}.intrographic{background:linear-gradient(130deg,#083e33,#0d6c55 70%,#d5aa64);color:#f8e4bd;padding:22px;border-radius:12px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}.intrographic h2{font:italic 34px Georgia;margin:0}.mini{font-size:12px;color:#6a6f73}.selectcard{display:flex;align-items:center;gap:9px}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}@media(max-width:1000px){.layout{grid-template-columns:68px 1fr}.side .nav span,.sidecap,.sidebar-bottom{display:none}.side{padding:15px 8px}.nav{font-size:20px;justify-content:center;padding:12px 6px}.main{padding:25px 20px}.metrics{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.layout{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #ddd;padding:5px}.side .nav span{display:inline}.nav{font-size:12px;width:auto;white-space:nowrap;gap:5px}.main{padding:23px 14px}.search{display:none}.grid2,.grid3,.formgrid,.two,.intro{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.artpreview{flex-direction:column}.top{padding:0 12px}.heading{font-size:22px}.steps{gap:4px}.step{font-size:10px;padding:7px 8px}.tray{grid-template-columns:1fr}.foot{flex-wrap:wrap}}
</style></head><body><div id="app"></div><input id="fileCsv" type="file" accept=".csv,text/csv" hidden><input id="filePhoto" type="file" accept="image/*" hidden><script>
const STORAGE='tet-studio-mvp-2027-v1';const demoEmployees=[['E001','Nguyễn Minh Anh','Product Manager','Ra mắt sản phẩm mới','The Problem Solver'],['E002','Trần Thu Hà','People & Culture','Gắn kết đội ngũ 2026','The Team Builder'],['E003','Lê Quốc Duy','Marketing Lead','3 chiến dịch tăng trưởng','The Creative Mind'],['E004','Phạm Hoàng Long','Engineering','Hoàn tất dự án quan trọng','The Builder'],['E005','Đỗ Ngọc Linh','Design','Ra mắt bộ nhận diện mới','The Visionary'],['E006','Vũ Đức Huy','Sales','Đạt cột mốc doanh số','The Go-Getter'],['E007','Bùi Thảo My','Customer Care','Ghi nhận phản hồi khách hàng','The Care Champion'],['E008','Hoàng Minh Quân','Operations','Cải tiến quy trình nội bộ','The Fixer'],['E009','Nguyễn Bảo Trâm','Finance','Tối ưu quy trình đối soát','The Organizer'],['E010','Trịnh Gia Bảo','Business','Mở rộng quan hệ đối tác','The Explorer']].map(([id,name,role,milestone,award])=>({id,name,role,milestone,award,status:'Draft',style:'chibi',note:'Cảm ơn vì đã đồng hành cùng tập thể trong năm 2026.',photo:''}));const init=()=>({page:'dashboard',step:0,campaigns:[{id:'DEMO-2027',name:'Lumina Studio',story:'2026 là năm chúng ta cùng vượt thử thách, ra mắt sản phẩm mới và xây dựng đội ngũ vững mạnh.',values:'Sáng tạo, trách nhiệm, đồng hành',milestones:'Ra mắt sản phẩm mới; Mở rộng đội ngũ; Hoàn thành dự án lớn',purpose:'Tri ân và ghi nhận những đóng góp thực tế',count:30,budget:799000,concept:'journey',intensity:'balanced',art:'chibi',employees:demoEmployees,active:true,box:'signature',created:'15/11/2026'}],selected:'DEMO-2027',empFilter:'',empSearch:'',selectedEmployee:'E001',tab:'all',modal:null});let s;try{s=JSON.parse(localStorage.getItem(STORAGE))||init()}catch(e){s=init()}const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){toast('Không thể lưu thêm dữ liệu vào trình duyệt.')}};function camp(){return s.campaigns.find(c=>c.id===s.selected)||s.campaigns[0]}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function money(x){return Number(x||0).toLocaleString('vi-VN')+'đ'}function toast(t){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),3300)}const ICON={home:'⌂',campaign:'▣',people:'♙',review:'✓',production:'▤',settings:'⚙',sparkle:'✦'};function page(p){s.page=p;save();render()}function step(i){s.step=i;s.page='builder';save();render()}function setC(k,v){camp()[k]=v;save()}function setE(id,k,v){let e=camp().employees.find(x=>x.id===id);if(e){e[k]=v;save()}}function countApproved(){return camp().employees.filter(e=>e.status==='Approved').length}function currentRate(){let a=camp().employees;return a.length?Math.round(100*countApproved()/a.length):0}function head(title,desc,extra=''){return `<div class="row between wrap"><div><p class="eyebrow">Tết Studio / ${esc(camp().name)}</p><h1 class="heading">${title}</h1>${desc?`<p class="sub">${desc}</p>`:''}</div>${extra}</div>`}function btn(txt,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${txt}</button>`}function field(title,key,type='text',help=''){let v=camp()[key]??'';return `<div class="field"><label class="fld" for="f-${key}">${title}</label>${type==='textarea'?`<textarea class="textarea" id="f-${key}" onchange="setC('${key}',this.value)">${esc(v)}</textarea>`:`<input class="input" id="f-${key}" type="${type}" value="${esc(v)}" onchange="setC('${key}',this.type==='number'?Number(this.value):this.value)">`}${help?`<div class="mini" style="margin-top:6px">${help}</div>`:''}</div>`}function moveNext(){step(Math.min(5,s.step+1))}function makeCampaign(){const id='CAM-'+Date.now();let c={...init().campaigns[0],id,name:'Doanh nghiệp mới',story:'',values:'',milestones:'',purpose:'',count:10,budget:699000,employees:[],created:new Date().toLocaleDateString('vi-VN')};s.campaigns.unshift(c);s.selected=id;s.step=0;s.page='builder';save();render();toast('Đã tạo campaign mới')}function nav(){return `<aside class="side"><div class="sidecap">Workspace</div>${[['dashboard','⌂','Tổng quan'],['builder','✦','Campaign Builder'],['employees','♙','Nhân sự'],['approvals','✓','Duyệt artwork'],['production','▤','Sản xuất'],['settings','⚙','Cài đặt']].map(([p,ico,label])=>`<button class="nav ${s.page===p?'active':''}" onclick="page('${p}')">${ico} <span>${label}</span></button>`).join('')}<div class="sidebar-bottom"><strong>MVP Demo · Tết 2027</strong><br>Dữ liệu lưu trên trình duyệt này. Chưa kết nối AI, Shopify hay nhà sản xuất.</div></aside>`}function dashboard(){return `${head('Tổng quan chiến dịch','Tạo trải nghiệm quà Tết kể lại hành trình 2026, cá nhân hóa tới từng nhân viên.',btn('+ Tạo chiến dịch','makeCampaign()','primary'))}<div class="metrics">${[['Campaign',s.campaigns.length],['Nhân sự',camp().employees.length],['Đã duyệt',countApproved()],['Tiến độ',currentRate()+'%']].map(([a,b])=>`<div class="card metric"><div class="muted small">${a}</div><div class="n">${b}</div></div>`).join('')}</div><div class="intro"><div class="card cp"><div class="row between"><h3>Campaign của anh</h3><span class="tag">Dữ liệu demo</span></div>${s.campaigns.map(c=>`<div class="well" style="margin-top:10px"><div class="row between wrap"><div><div class="small muted">${esc(c.id)} · ${esc(c.created)}</div><h3 style="margin:7px 0">${esc(c.name)} — Tết 2027</h3><div class="small muted">${esc(c.concept==='journey'?'The Year We Built Together':c.concept==='premium'?'Vietnamese Premium':'Playful Tết')}</div></div>${btn('Mở chiến dịch',`openCampaign('${c.id}')`,'soft')}</div><div class="progress"><div style="width:${c.employees.length?Math.round(c.employees.filter(x=>x.status==='Approved').length/c.employees.length*100):0}%"></div></div><div class="mini" style="margin-top:8px">${c.employees.filter(x=>x.status==='Approved').length}/${c.employees.length} artwork đã duyệt</div></div>`).join('')}</div><div class="intrographic"><div style="font-size:12px;letter-spacing:.1em;margin-bottom:15px">ONE COMPANY · EVERY STORY</div><h2>The Year<br>We Built Together</h2><p style="max-width:300px;line-height:1.6">Vỏ hộp kể câu chuyện chung. Acrylic giữ dấu ấn riêng của mỗi người.</p>${btn('Khám phá concept','step(1)')}</div></div><div class="grid2" style="margin-top:18px"><div class="card cp"><h3>Luồng MVP hiện tại</h3><p class="muted">Brief văn hóa → Concept → Gift box → Dữ liệu nhân sự → Duyệt artwork → Xuất dữ liệu sản xuất</p>${btn('Tiếp tục thiết kế','page(\'builder\')','primary')}</div><div class="card cp"><h3>Phạm vi demo</h3><p class="muted">Ảnh chibi, hộp, giá vốn và câu chuyện chỉ là preview minh họa. Không dùng dữ liệu nhân sự thật khi chưa kiểm tra bảo mật.</p></div></div>`}function openCampaign(id){s.selected=id;s.step=0;page('builder')}const steps=['Company Brief','Art Direction','Gift Box','Employee Data','Personalization','Production'];function builder(){let c=camp();let body='';if(s.step===0)body=`<div class="grid2"><div class="card cp"><h3>Company Story Brief</h3><p class="muted small">Những gì HR biết và đã xác minh về hành trình 2026.</p>${field('Tên doanh nghiệp','name')}${field('Giá trị văn hóa','values','textarea')}${field('Câu chuyện năm 2026','story','textarea')}${field('Cột mốc năm 2026 (phân cách bằng ;)','milestones','textarea')}${field('Mục tiêu chương trình','purpose','textarea')}</div><div><div class="card cp"><h3>Ngân sách và phạm vi</h3>${field('Số lượng dự kiến','count','number')}${field('Ngân sách trên nhân viên (VND)','budget','number')}<div class="well"><strong>Ngân sách giả định</strong><div style="font-size:26px;font-weight:750;margin-top:8px">${money(c.count*c.budget)}</div><div class="mini">Chưa phải báo giá xưởng.</div></div></div><div class="info" style="margin-top:14px">Chỉ nhập dữ liệu được phép sử dụng và cột mốc có thật. Không để AI suy đoán tính cách hoặc thành tích nhân viên.</div></div></div>`;
if(s.step===1)body=`<div class="card cp"><h3>Art direction cho hộp Tết</h3><p class="muted">Story first → Season second → Style third. Outer box sang, không đặt chibi lớn lên vỏ.</p><div class="grid3">${[['premium','Modern Vietnamese Premium','premium','Đỏ trầm, champagne gold, hoa mai và dấu Đinh Mùi tinh tế'],['journey','Journey Storybook','journey','Câu chuyện 2026, đường hành trình, chặng đường tập thể'],['playful','Playful Contemporary','playful','Màu sắc tươi, Việt hiện đại; chibi chỉ xuất hiện bên trong']].map(([key,title,cls,sub])=>`<div class="choice ${c.concept===key?'selected':''}" onclick="setC('concept','${key}');render()"><div class="swatch ${cls}"></div><strong>${title}</strong><div class="hint">${sub}</div><p class="small">${c.concept===key?'✅ Đang chọn':'○ Chọn concept'}</p></div>`).join('')}</div><h3 style="margin-top:25px">Cường độ không khí Tết Đinh Mùi</h3><div class="seg">${[['subtle','Tinh tế'],['balanced','Cân bằng'],['festive','Rực rỡ']].map(([k,l])=>`<button class="${c.intensity===k?'picked':''}" onclick="setC('intensity','${k}');render()">${l}</button>`).join('')}</div><div class="info" style="margin-top:24px">Bản đồ concept được ứng dụng nhất quán: vỏ hộp, mặt trong nắp, thiệp câu chuyện 2026, acrylic cá nhân hóa và thư ghi nhận.</div></div>`;
if(s.step===2)body=`<div class="grid2"><div class="card cp"><h3>Signature Tet Story Box</h3><p class="muted small">Kích thước nghiên cứu: 36 × 30 × 11 cm · Chưa phải cấu trúc kỹ thuật.</p>${boxMock(c)}<div class="info" style="margin-top:15px">Khoang acrylic đặt phẳng và chống xước, đế gỗ rời. Phần quà tiêu dùng đặt từ xưởng quà Tết, artwork acrylic đặt từ xưởng in.</div></div><div class="card cp"><h3>Thành phần gói quà</h3>${[['Trà premium','Đối tác hộp quà'],['Hạt dinh dưỡng','Đối tác hộp quà'],['Mứt/đặc sản','Đối tác hộp quà'],['Bánh Tết','Đối tác hộp quà'],['Acrylic chibi/portrait','Xưởng custom'],['Thiệp + Our 2026 Journey','In theo campaign']].map(([name,sup])=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid #eee"><strong>${name}</strong><span class="mini">${sup}</span></div>`).join('')}<div class="notice" style="margin-top:15px">Giá và tồn kho phải được đối chiếu supplier thực tế trước khi báo cho khách. Hộp chỉ là bản phối mẫu.</div></div></div>`;
if(s.step===3)body=employeesPanel();if(s.step===4)body=approvalsPanel();if(s.step===5)body=productionPanel();return `${head('Campaign Builder',`Bước ${s.step+1}/6 · ${steps[s.step]}`,btn('← Tổng quan',"page('dashboard')"))}<div class="steps">${steps.map((v,i)=>`<button class="step ${s.step===i?'active':i<s.step?'done':''}" onclick="step(${i})">${i+1}. ${v}</button>`).join('')}</div>${body}<div class="foot">${btn('← Quay lại',s.step===0?"page('dashboard')":`step(${s.step-1})`)}${s.step<5?btn('Tiếp theo →','moveNext()','primary'):btn('Xuất manifest CSV','exportManifest()','primary')}</div>`}function boxMock(c){return `<div class="boxmock"><div class="lid"><div style="font-size:11px;letter-spacing:.1em">${esc(c.name)} · TẾT ĐINH MÙI 2027</div><strong>${c.concept==='journey'?'The Year We Built Together':c.concept==='premium'?'A Year Worth Remembering':'Together, We Shine'}</strong><p>${esc(c.milestones||'Những điều chúng ta đã cùng tạo nên trong 2026')}</p></div><div class="tray"><div class="bay"><strong>Khoang quà Tết</strong><div class="treats">${[['🍵','Trà'],['🥜','Hạt'],['🍬','Mứt'],['🍪','Bánh']].map(x=>`<div class="treat"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div></div><div class="bay"><strong>Acrylic · Cá nhân hóa</strong><div class="standee" style="height:155px;width:auto"><div class="figure" style="width:105px;height:110px"><div class="hat">🌸</div><div class="avatar" style="font-size:38px">👩🏻‍💼</div></div><div class="wood">Nhân sự</div></div></div></div></div>`}function employeesPanel(){let c=camp(),a=c.employees;return `<div class="card cp"><div class="row between wrap"><div><h3>Danh sách nhân sự (${a.length})</h3><p class="muted small">Dữ liệu mẫu; HR có thể sửa từng ô hoặc nhập CSV.</p></div><div class="row wrap">${btn('↓ Tải CSV mẫu','downloadTemplate()')}${btn('↑ Nhập CSV',"$('fileCsv').click()")}${btn('+ Thêm nhân sự','addEmployee()','primary')}</div></div><div class="field" style="margin-top:15px"><input class="input" placeholder="Tìm theo tên, mã, phòng ban, cột mốc..." value="${esc(s.empSearch)}" oninput="s.empSearch=this.value;drawEmployeeTable()" id="empSearch"></div><div id="empTable">${employeeTable()}</div><div class="notice" style="margin-top:15px">Dữ liệu ảnh và thông tin nhân sự thật là dữ liệu cá nhân. MVP lưu trên máy đang mở, không phù hợp để triển khai với dữ liệu thật hoặc dùng trên máy chia sẻ.</div></div>`}function employeeTable(){let a=camp().employees.filter(e=>[e.name,e.role,e.id,e.milestone].join(' ').toLowerCase().includes((s.empSearch||'').toLowerCase()));return `<div class="tablewrap"><table class="table"><thead><tr><th>Employee ID</th><th>Họ tên</th><th>Vai trò</th><th>Cột mốc 2026</th><th>Badge</th><th>Trạng thái</th><th></th></tr></thead><tbody>${a.length?a.map(e=>`<tr><td>${esc(e.id)}</td><td><input value="${esc(e.name)}" onchange="setE('${e.id}','name',this.value)"></td><td><input value="${esc(e.role)}" onchange="setE('${e.id}','role',this.value)"></td><td><input style="min-width:175px" value="${esc(e.milestone)}" onchange="setE('${e.id}','milestone',this.value)"></td><td><input value="${esc(e.award)}" onchange="setE('${e.id}','award',this.value)"></td><td><span class="tag ${e.status==='Approved'?'':e.status==='Rejected'?'warn':'gray'}">${e.status}</span></td><td><button class="btn" onclick="s.selectedEmployee='${e.id}';step(4)">Xem</button></td></tr>`).join(''):`<tr><td colspan="7" style="text-align:center;padding:25px">Không có nhân sự phù hợp. Hãy thêm hoặc import CSV.</td></tr>`}</tbody></table></div>`}function drawEmployeeTable(){let e=$('empTable');if(e)e.innerHTML=employeeTable()};function addEmployee(){let a=camp().employees;let id='E'+String(1+Math.max(0,...a.map(x=>Number(x.id.replace(/\D/g,''))||0))).padStart(3,'0');a.push({id,name:'Nhân sự mới',role:'',milestone:'',award:'The Team Player',status:'Draft',style:camp().art,note:'Cảm ơn vì đã đồng hành!',photo:''});save();render();toast('Đã thêm '+id)}function approvalsPanel(){let c=camp(),a=c.employees,e=a.find(x=>x.id===s.selectedEmployee)||a[0];if(!e)return `<div class="card cp"><h3>Chưa có nhân sự</h3><p class="muted">Import CSV hoặc thêm nhân sự trước khi duyệt artwork.</p>${btn('Đi tới nhân sự',"step(3)",'primary')}</div>`;return `<div class="grid2"><div class="card cp"><div class="row between wrap"><h3>Gallery · ${a.length} nhân viên</h3><span class="tag">${countApproved()} approved</span></div><div class="row wrap" style="margin-bottom:15px"><input class="input" style="flex:1;min-width:160px" placeholder="Tìm nhân viên" value="${esc(s.empSearch)}" oninput="s.empSearch=this.value;render()">${btn('Duyệt tất cả','approveAll()','soft')}</div><div style="max-height:510px;overflow:auto">${a.filter(e=>[e.name,e.role,e.id].join(' ').toLowerCase().includes((s.empSearch||'').toLowerCase())).map(x=>`<button class="choice ${e.id===x.id?'selected':''}" style="display:flex;gap:11px;align-items:center;width:100%;text-align:left;margin-bottom:7px" onclick="s.selectedEmployee='${x.id}';render()"><div style="font-size:26px">${x.style==='chibi'?'🧑🏻‍🎨':'🪪'}</div><div style="flex:1"><strong>${esc(x.name)}</strong><div class="hint">${esc(x.milestone)}</div></div><span class="tag ${x.status==='Approved'?'':x.status==='Rejected'?'warn':'gray'}">${x.status}</span></button>`).join('')}</div></div><div class="card cp"><div class="row between wrap"><h3>Preview · ${esc(e.name)}</h3><span class="tag gray">Illustrative demo</span></div><div class="artpreview"><div class="standee"><div class="figure">${e.photo?`<img src="${e.photo}" style="object-fit:cover;width:95px;height:95px;border-radius:50%;border:3px solid white" alt="employee portrait">`:`<div class="hat">🧧 🌸</div><div class="avatar">${e.style==='chibi'?'🧑🏻‍🎨':'🧑🏻‍💼'}</div>`}</div><div class="wood">${esc(e.name)}</div></div><div style="min-width:0"><div class="small muted">TẾT 2027 · ĐINH MÙI</div><h3 style="margin:10px 0">${esc(e.award)}</h3><p style="line-height:1.5">${esc(e.milestone)}</p><span class="tag">${e.style==='chibi'?'Chibi playful':'Portrait preservation'}</span></div></div><p class="mini">Chưa tích hợp AI tạo chibi thực sự. Ảnh upload chỉ hiển thị ảnh gốc để demo việc gắn với nhân viên.</p><hr class="divider"><div class="field"><label class="fld">Phong cách acrylic</label><div class="seg"><button class="${e.style==='chibi'?'picked':''}" onclick="setE('${e.id}','style','chibi');render()">Chibi Tết</button><button class="${e.style==='portrait'?'picked':''}" onclick="setE('${e.id}','style','portrait');render()">Giữ ảnh thật</button></div></div><div class="field"><label class="fld">Ảnh chân dung (chỉ lưu tạm trong browser)</label><button class="btn" onclick="choosePhoto('${e.id}')">↑ Chọn ảnh</button></div><div class="field"><label class="fld">Danh hiệu / badge</label><input class="input" value="${esc(e.award)}" onchange="setE('${e.id}','award',this.value);render()"></div><div class="field"><label class="fld">Cột mốc đã xác minh</label><input class="input" value="${esc(e.milestone)}" onchange="setE('${e.id}','milestone',this.value);render()"></div><div class="field"><label class="fld">Lời ghi nhận</label><textarea class="textarea" onchange="setE('${e.id}','note',this.value)">${esc(e.note)}</textarea></div><div class="row wrap">${btn('✓ Duyệt',`status('${e.id}','Approved')`,'primary')}${btn('↺ Sửa lại',`status('${e.id}','Rejected')`,'danger')}${btn('Đặt về Draft',`status('${e.id}','Draft')`)}</div></div></div>`}function status(id,v){setE(id,'status',v);render();toast('Đã cập nhật: '+v)}function approveAll(){if(!confirm('Duyệt toàn bộ các bản artwork demo? Đây KHÔNG phải file in thật.'))return;camp().employees.forEach(e=>e.status='Approved');save();render();toast('Đã duyệt tất cả bản demo')}let photoTarget='';function choosePhoto(id){photoTarget=id;$('filePhoto').click()}function productionPanel(){let c=camp(),a=c.employees,approved=a.filter(e=>e.status==='Approved').length,missing=a.filter(e=>!e.name||!e.milestone||!e.id).length;const estimate=c.count*c.budget;return `<div class="grid2"><div class="card cp"><h3>Production Readiness</h3><p class="muted">Trước khi đặt supplier, kiểm tra toàn bộ manifest và mẫu thực tế.</p>${[['Danh sách Employee ID không thiếu',missing===0],['Không trùng Employee ID',new Set(a.map(x=>x.id)).size===a.length],['Artwork demo đã được duyệt hết',a.length>0&&approved===a.length],['Mẫu vật lý và đường cắt được xưởng duyệt',false],['Báo giá quà Tết và MOQ đã xác nhận',false]].map(([t,ok])=>`<div class="row" style="padding:12px;border-bottom:1px solid #eee"><span style="color:${ok?'#008060':'#aa6d16'}">${ok?'✓':'○'}</span>${t}</div>`).join('')}<p class="notice" style="margin-top:15px">Xuất CSV là để kiểm tra mapping. Không phải file print-ready, chưa có cutline, bleed hoặc thông số UV do xưởng xác nhận.</p></div><div class="card cp"><h3>Ngân sách & phân bổ supplier</h3><div class="well"><div class="muted small">Ngân sách theo brief</div><div style="font-size:28px;font-weight:750;margin-top:7px">${money(estimate)}</div><div class="mini">${c.count} người × ${money(c.budget)}</div></div>${[['Supplier A','Gift box 4–5 món + bao bì + lắp bộ'],['Supplier B','Acrylic + đế + mã nhân viên'],['Tet Studio','Artwork, QA, xuất manifest, điều phối']].map(([a,b])=>`<div style="padding:13px 0;border-bottom:1px solid #eee"><strong>${a}</strong><div class="small muted">${b}</div></div>`).join('')}<div style="margin-top:20px" class="row wrap">${btn('↓ Xuất manifest CSV','exportManifest()','primary')}${btn('↓ Xuất campaign JSON','exportJSON()')}</div></div></div>`}function settings(){return `${head('Cài đặt MVP','Quản lý dữ liệu bản demo và phạm vi sử dụng.') }<div class="grid2"><div class="card cp"><h3>Local prototype</h3><p class="muted">Không có server, tài khoản hay đồng bộ. Campaign và danh sách nhân sự được lưu vào localStorage của trình duyệt này.</p>${btn('Khôi phục dữ liệu demo', 'resetDemo()','danger')}</div><div class="card cp"><h3>Bảo mật trước khi dùng thực tế</h3><p class="muted">Cần login, phân quyền HR, mã hóa ảnh, đồng ý xử lý dữ liệu, lưu/xóa dữ liệu theo quy định, audit log và storage bảo mật trước khi nhận ảnh và dữ liệu nhân viên thật.</p></div></div>`}function resetDemo(){if(confirm('Xóa tất cả thay đổi local và phục hồi demo ban đầu?')){s=init();save();render();toast('Đã khôi phục dữ liệu demo')}}function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type:type||'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvCell(x){let str=String(x??'');return '"'+str.replaceAll('"','""')+'"'}function downloadTemplate(){download('tet-studio-employee-template.csv','\uFEFF'+['employee_id','name','role','milestone_2026','award','message'].join(',')+'\n'+['E001','Nguyễn Minh Anh','Product Manager','Ra mắt sản phẩm mới','The Problem Solver','Cảm ơn bạn'].map(csvCell).join(',')+'\n','text/csv;charset=utf-8')}function exportManifest(){let c=camp(),h=['campaign_id','employee_id','employee_name','role','milestone_2026','award','art_style','approval_status','message','acrylic_supplier','giftbox_supplier'];download('tet2027-production-manifest.csv','\uFEFF'+h.join(',')+'\n'+c.employees.map(e=>[c.id,e.id,e.name,e.role,e.milestone,e.award,e.style,e.status,e.note,'TBD','TBD'].map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');toast('Đã xuất manifest CSV')}function exportJSON(){let c=structuredClone(camp());c.employees.forEach(e=>e.photo='');download('tet2027-campaign-demo.json',JSON.stringify(c,null,2),'application/json');toast('Đã xuất JSON (không kèm ảnh)')}function parseCSV(str){let out=[],row=[],cell='',quotes=false;str=str.replace(/^\uFEFF/,'');for(let i=0;i<str.length;i++){let ch=str[i];if(ch==='"'){if(quotes&&str[i+1]==='"'){cell+='"';i++}else quotes=!quotes}else if(ch===','&&!quotes){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quotes){if(ch==='\r'&&str[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}function importCSV(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{let rows=parseCSV(reader.result),h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());const idx=x=>h.indexOf(x);if(idx('employee_id')<0||idx('name')<0){toast('CSV cần có cột employee_id và name.');return}let seen=new Set(),items=[],errors=[];rows.forEach((r,i)=>{let get=x=>idx(x)<0?'':(r[idx(x)]||'').trim(),id=get('employee_id'),name=get('name');if(!id||!name||seen.has(id)){errors.push(i+2);return}seen.add(id);items.push({id,name,role:get('role'),milestone:get('milestone_2026'),award:get('award')||'The Team Player',note:get('message')||'Cảm ơn bạn vì đã đồng hành!',status:'Draft',style:camp().art||'chibi',photo:''})});if(errors.length){alert('Dòng trống/trùng ID: '+errors.slice(0,15).join(', ')+'. Vui lòng sửa CSV rồi nhập lại.');return}if(!items.length){toast('Không có hàng hợp lệ trong CSV');return}if(confirm('Thay toàn bộ danh sách hiện tại bằng '+items.length+' nhân sự trong CSV?')){camp().employees=items;save();render();toast('Đã nhập '+items.length+' nhân sự')}};reader.readAsText(file,'UTF-8')}function render(){document.title='Tết Studio · MVP';$('app').innerHTML=`<header class="top"><div class="logo"><span class="mark">✦</span> Tết Studio</div><div class="search">⌕ &nbsp; Employee Gifting · Campaign Workspace</div><div class="spacer"></div><span class="pill">● Prototype 2027</span><span class="topright">Local demo</span></header><div class="layout">${nav()}<main class="main">${s.page==='dashboard'?dashboard():s.page==='builder'?builder():s.page==='employees'?head('Nhân sự','Nhập, chỉnh sửa dữ liệu và cột mốc đã xác minh.')+employeesPanel():s.page==='approvals'?head('Duyệt artwork','Chọn nhân sự, chỉnh thông điệp và phê duyệt mẫu.')+approvalsPanel():s.page==='production'?head('Sẵn sàng sản xuất','Xuất mapping để đối chiếu với hai supplier.')+productionPanel():settings()}<div style="margin-top:60px;color:#93999d;font-size:11px">Tết Studio · Concept Prototype · Không phải nền tảng xử lý dữ liệu nhân sự thật hoặc báo giá xác nhận.</div></main></div>`;save()};$('fileCsv').addEventListener('change',e=>{importCSV(e.target.files[0]);e.target.value=''});$('filePhoto').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(f.size>900000){toast('Ảnh demo phải dưới 900 KB để tránh quá giới hạn lưu local.');return}const reader=new FileReader();reader.onload=()=>{setE(photoTarget,'photo',reader.result);render();toast('Ảnh demo đã được nạp')};reader.readAsDataURL(f);e.target.value=''});render();
</script></body></html>
