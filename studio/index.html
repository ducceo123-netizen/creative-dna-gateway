/* Standalone Shopify-admin shell using official Polaris 2.0 web components. */
s-section{display:block} s-badge{display:inline-flex;vertical-align:middle} s-button{display:inline-flex;vertical-align:middle}
s-table{display:block;width:100%}.polaris-task-table{overflow-x:auto}.polaris-task-row{cursor:pointer}
s-text-field,s-text-area,s-select{display:block;width:100%;margin:12px 0}
s-section{display:block;min-width:0}
.grid>s-section{min-height:100%;background:#fff;border:1px solid #e3e3e3;border-radius:12px}
s-table-row[data-select]{cursor:pointer}
.panelhead{align-items:center}
.panelhead p{margin:0}
main{background:#f1f1f1}
.sidebar .hint{background:#e4e4e4;color:#616161}
.status-tabs{margin:10px 0}
@media(max-width:960px){.grid>s-section{min-height:auto}}
.polaris-kicker{font-size:12px;letter-spacing:0;color:#6a6a6a;text-transform:none}
.polaris-stat-value{font-size:29px;font-weight:700;letter-spacing:-1.2px;margin:8px 0}
.polaris-stat-label{font-size:12px;color:#606060}.polaris-stat{min-height:112px}

/* Shopify home-like lightweight KPI strip and centered task composer */
.home-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid #ededed;padding:3px 0 18px;gap:14px}
.home-metric{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.home-metric span{font-size:12px;color:#737373}
.home-metric strong{font-size:18px;line-height:1.2;font-weight:720;letter-spacing:-.035em}
.welcome-hero{text-align:center;padding:clamp(38px,5vw,85px) 0 72px;margin:0 auto;max-width:850px}

.welcome-hero>p{font-size:clamp(17px,1.5vw,22px);color:#343434;letter-spacing:-.03em;margin:0 0 25px;font-weight:500}

.composer-bottom{display:flex;align-items:center;justify-content:space-between}
.composer-mark{font-size:20px;color:#6256ba}

.home-bottom{max-width:1000px;margin:0 auto}

.workspace-chip{color:#787878;font-size:12px}

/* Shopify Admin-style visual shell: matching reference silhouette, not fake Shopify metrics. */
:root{background:#0b0b0b;color:#303030;--ink:#303030;--canvas:#f7f7f7;--border:#e3e3e3}
html,body{height:100%;background:#0b0b0b}
.shell{grid-template-columns:244px minmax(0,1fr);min-height:100vh;background:#0b0b0b;gap:0}
.sidebar{position:sticky;top:0;height:100vh;min-height:540px;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px 12px;gap:15px;background:#0b0b0b;border:0;color:#ededed;box-shadow:none}
.sidebar-top{display:grid;gap:18px}
.brand{color:#fff;padding:0 9px;font-size:14px;letter-spacing:-.02em;font-weight:700;gap:10px;min-height:34px}
.logo{width:29px;height:29px;border-radius:8px;background:#95bf47;color:#112512;font-size:19px;display:grid;place-items:center}
.brand-collapse{margin-left:auto;font-size:18px;color:#969696;font-weight:400}
.nav-search{display:flex;align-items:center;gap:9px;min-height:36px;padding:0 10px;background:#252525;border:1px solid #353535;border-radius:9px;color:#a5a5a5;cursor:text}
.nav-search>span{font-size:22px;line-height:1}
.nav-search input{width:100%;flex:1;min-width:0;color:#eee;border:0;outline:0;background:transparent;font-size:12px;padding:0}
.nav-search input::placeholder{color:#939393}
.nav-search kbd{font-size:10px;color:#aaa;white-space:nowrap}
.sidebar .menu{display:flex;flex-direction:column;gap:2px;padding:0;overflow:visible}
.sidebar .menu button{min-height:33px;padding:7px 10px;color:#c9c9c9;background:transparent;border:0;border-radius:8px;font-size:13px;font-weight:500;letter-spacing:-.01em;line-height:18px;gap:10px}
.sidebar .menu button:hover{background:#222;color:#fff}
.sidebar .menu button.active{background:#292929;color:#fff;font-weight:650}
.nav-ico{width:18px;flex:none;font-size:17px;display:inline-grid;place-items:center;color:#979797;font-weight:400}
.sidebar .menu button.active .nav-ico{color:#eee}
.nav-heading{font-size:11px;letter-spacing:.02em;color:#929292;margin:20px 10px 6px;font-weight:500}
.sidebar-bottom{margin-top:auto;display:flex;align-items:center;gap:9px;padding:13px 9px 2px;border-top:1px solid #272727}
.workspace-avatar{height:28px;width:28px;display:grid;place-items:center;border-radius:8px;background:#95bf47;color:#163e1e;font-weight:750;font-size:12px}
.workspace-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.workspace-info strong{font-size:12px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace-info span{color:#aaa;font-size:11px}
.workspace-dots{font-size:11px;color:#aaa}
.workspace-frame{background:#fff;border-radius:18px 0 0 18px;min-width:0;margin:4px 4px 4px 0;min-height:calc(100vh - 8px);box-shadow:0 4px 24px #0001;overflow:hidden}
.main{max-width:none;min-width:0;margin:0;padding:0;background:#fff;min-height:calc(100vh - 8px)}
.top{border:0;padding:26px clamp(24px,3.8vw,64px) 18px;align-items:center;background:#fff}
.heading-block{min-width:0}
.top h1{font-size:25px;font-weight:680;letter-spacing:-.035em;line-height:1.22;margin:9px 0 5px;color:#202020}
.polaris-kicker{font-size:12px;color:#737373;font-weight:500}
.crumb-separator{padding:0 7px;color:#aaa}
.page-subtitle{font-size:13px;color:#7b7b7b;margin:0;line-height:1.5}
.header-actions{display:flex;gap:12px;align-items:center}
.pill{color:#5c5c5c;background:#f6f6f6;border:1px solid #e9e9e9;font-size:11px;padding:7px 12px;font-weight:500}
.content{padding:14px clamp(24px,3.8vw,64px) 64px;max-width:1480px;margin:0 auto}
.stats{gap:14px;margin-bottom:23px}
.polaris-stat{border:1px solid #e7e7e7;border-radius:12px;background:#fff;box-shadow:0 1px 2px #00000005;min-height:116px}
.polaris-stat-value{font-size:28px;color:#252525}
.polaris-stat-label{font-size:11px;color:#939393}

<script>
'use strict';
const KEY='uid_brands_studio_tasks_v1';
const types=['Onepage','LDP','Scale Store Brand','UGC'];
const brands=['PawfectHouse','GiftSoul','SoulPrise'];
const statuses=['Draft','In progress','In review','Approved'];
const iconFor={Onepage:'▣',LDP:'▤','Scale Store Brand':'◈',UGC:'◎'};
const state={page:'dashboard',selected:null,filter:'All',workflowFilter:null,prefillWorkflow:null,prefillBrief:'',prefillTitle:'',prefillSource:'',prefillBrand:'PawfectHouse',composerDraft:'',search:'',ai:false,cloud:false,auth:null,user:null,token:'',busy:false};
let tasks=[];
try {const stored=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(stored)?stored.filter(x=>x&&typeof x.id==='string'):[];}catch{}
const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{if(state.cloud)return;try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch{toast('Không thể lưu: browser storage đầy hoặc bị chặn.');}};
function toast(m){const n=el('toast');n.textContent=m;n.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>n.style.display='none',3600);}
function statusBadge(s){const tone=s==='Approved'?'success':s==='In review'?'warning':s==='In progress'?'info':'auto';return '<s-badge tone="'+tone+'">'+escapeHtml(s)+'</s-badge>';}
function label(text,field){return '<label class="label" for="'+field+'">'+text+'</label>';}
function field(id,value,placeholder='',type='text'){return '<input class="input" id="'+id+'" type="'+type+'" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(placeholder)+'"/>';}
function textarea(id,value,placeholder=''){return '<textarea class="input textarea" id="'+id+'" placeholder="'+escapeHtml(placeholder)+'">'+escapeHtml(value)+'</textarea>';}
function options(list,val){return list.map(x=>'<s-option value="'+escapeHtml(x)+'" '+(x===val?'selected':'')+'>'+escapeHtml(x)+'</s-option>').join('');}
function polarisField(id,labelText,value,placeholder=''){return '<s-text-field id="'+id+'" label="'+escapeHtml(labelText)+'" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(placeholder)+'"></s-text-field>';}
function polarisArea(id,labelText,value,placeholder=''){return '<s-text-area id="'+id+'" label="'+escapeHtml(labelText)+'" rows="5" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(placeholder)+'"></s-text-area>';}
function polarisSelect(id,labelText,values,value){return '<s-select id="'+id+'" label="'+escapeHtml(labelText)+'" value="'+escapeHtml(value)+'">'+options(values,value)+'</s-select>';}
function button(text,act,cls='secondary'){const variant=cls===''?'primary':'secondary',tone=cls==='danger'?'critical':'auto';return '<s-button variant="'+variant+'" tone="'+tone+'" data-action="'+act+'">'+text+'</s-button>';}
function selectTask(id){state.selected=id;state.page='tasks';render();}
function navigate(page){
 // All Create task entry points from Home preserve the user's typed request.
 if(page==='create'&&state.page==='dashboard'){
   const typed=String(el('composerBrief')?.value??state.composerDraft??'').trim();
   if(typed){createFromComposer();return;}
 }
 state.page=page;
 if(page==='create')state.selected=null;
 else {state.prefillWorkflow=null;state.prefillBrief='';state.prefillTitle='';state.prefillSource='';state.prefillBrand='PawfectHouse';}
 if(page==='tasks')state.workflowFilter=null;
 render();
}
function openWorkflow(workflow){
 if(!types.includes(workflow))return;
 state.workflowFilter=workflow;state.filter='All';state.selected=null;state.page='tasks';render();
}
function startWorkflow(workflow){
 if(!types.includes(workflow))return;
 // Quick workflow choices should not discard a Home composer draft.
 if(state.page==='dashboard'){
  const typed=String(el('composerBrief')?.value??state.composerDraft??'').trim();
  if(typed){
   createFromComposer();
   state.prefillWorkflow=workflow;
   // Keep title and source aligned when user explicitly overrides workflow.
   const parsed=parseTaskRequest(typed);
   state.prefillTitle=parsed.source?parsed.title.replace(/ · (Onepage|LDP|UGC|Scale Store Brand)$/,' · '+workflow):workflow+' · New task';
   render();
   return;
  }
 }
 state.prefillWorkflow=workflow;state.prefillBrief='';state.prefillTitle='';state.prefillSource='';state.prefillBrand='PawfectHouse';state.selected=null;state.page='create';render();
}

function parseTaskRequest(raw){
 const input=String(raw||'').replace(/\s+/g,' ').trim();
 const lower=input.toLowerCase();
 const workflow=/scale\s*(store\s*)?brand|brand\s*ui|creative\s*dna/i.test(input)?'Scale Store Brand':/\bugc\b|user.generated.content/i.test(input)?'UGC':/\bldp\b|landing\s*pages?|landingpage/i.test(input)?'LDP':'Onepage';
 const brand=/\bgift\s*soul\b/i.test(input)?'GiftSoul':/\bsoul\s*prise\b/i.test(input)?'SoulPrise':'PawfectHouse';
 const explicit=/\b(?:Onepage|Landing\s*pages?|Landingpage|LDP|UGC(?:\s*materials?)?|Scale\s*Store\s*Brand)\s+(?:cho|for|of|về|sản phẩm|collection)\s*[-–—:]?\s*(.+)$/i.exec(input);
 const afterFor=/\b(?:cho|for)\s*[-–—:]\s*(.+)$/i.exec(input);
 const urlMatch=input.match(/https:\/\/[^\s<>"']+/i);
 let source=(explicit?.[1]||afterFor?.[1]||urlMatch?.[0]||'').trim().replace(/[.!?]+$/,'');
 if(source.length>160)source=source.slice(0,160);
 const hasSource=Boolean(source)&&!/(^onepage$|^ldp$|^ugc$)/i.test(source);
 let productName=source;
 if(/^https:\/\//i.test(source)){
  try{const url=new URL(source);const part=url.pathname.split('/').filter(Boolean).at(-1)||url.hostname;productName=decodeURIComponent(part).replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}catch{productName='Linked product or collection';}
 }
 productName=productName.replace(/\s+/g,' ').trim();
 const taskTitle=hasSource?productName.slice(0,120)+' · '+workflow:workflow+' · New task';
 // Original request remains the editable brief; product and workflow are stored separately.
 return {workflow,brand,source:hasSource?source:'',title:taskTitle,brief:input};
}

function createFromComposer(){
 const input=el('composerBrief');
 const brief=String(input?input.value:state.composerDraft||'').trim();
 if(!brief){input?.focus();toast('Anh nhập brief hoặc PDP/collection link trước khi tạo task.');return;}
 state.composerDraft=brief;
 const intent=parseTaskRequest(brief);
 state.prefillBrief=intent.brief;
 state.prefillTitle=intent.title;
 state.prefillWorkflow=intent.workflow;
 state.prefillBrand=intent.brand;
 state.prefillSource=intent.source;
 state.selected=null;state.page='create';render();
 if(intent.source&&state.cloud&&state.auth&&!intent.source.startsWith('https://'))setTimeout(()=>lookupStore(),0);
}
function taskRow(t){return '<s-table-row data-select="'+escapeHtml(t.id)+'"><s-table-cell><strong>'+escapeHtml(t.title)+'</strong></s-table-cell><s-table-cell>'+escapeHtml(t.brand)+'</s-table-cell><s-table-cell>'+escapeHtml(t.workflow)+'</s-table-cell><s-table-cell>'+statusBadge(t.status)+'</s-table-cell><s-table-cell>'+new Date(t.updatedAt).toLocaleDateString('vi-VN')+'</s-table-cell></s-table-row>';}
function taskTable(rows){return '<div class="polaris-task-table"><s-table><s-table-header-row><s-table-header listSlot="primary">Task</s-table-header><s-table-header>Brand</s-table-header><s-table-header>Workflow</s-table-header><s-table-header>Status</s-table-header><s-table-header>Updated</s-table-header></s-table-header-row><s-table-body>'+rows.map(taskRow).join('')+'</s-table-body></s-table></div>';}
function stats(){return '<div class="stats">'+[['Total tasks',tasks.length],['In progress',tasks.filter(t=>t.status==='In progress').length],['In review',tasks.filter(t=>t.status==='In review').length],['Approved',tasks.filter(t=>t.status==='Approved').length]].map(([name,value])=>'<s-section class="polaris-stat" heading="'+name+'"><div class="polaris-stat-value">'+value+'</div><div class="polaris-stat-label">'+(state.cloud?'Cloud workspace':'Local workspace')+'</div></s-section>').join('')+'</div>';}
function dashboard(){
 const recent=[...tasks].sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,6);
 const signed=state.cloud?'<div class="dashboard-user"><span class="workspace-chip">Signed in · '+escapeHtml(state.user?.email||'')+'</span>'+button('Sign out','logout')+'</div>':'';
 return '<div class="home-metrics">'+[['Total tasks',tasks.length],['In progress',tasks.filter(t=>t.status==='In progress').length],['In review',tasks.filter(t=>t.status==='In review').length],['Approved',tasks.filter(t=>t.status==='Approved').length]].map(([label,count])=>'<div class="home-metric"><span>'+label+'</span><strong>'+count+'</strong></div>').join('')+'</div>'+
 '<section class="welcome-hero"><h2>What will we create today?</h2><p>Start with a product, an idea, or a link.</p><div class="sidekick-composer"><label class="composer-label" for="composerBrief">New creative task</label><textarea id="composerBrief" class="composer-input" rows="2" maxlength="12000" placeholder="e.g. Create a Onepage for LED Bottle Light Topper…">'+escapeHtml(state.composerDraft)+'</textarea><div class="composer-footer"><div class="composer-workflow"><span class="composer-footer-label">Workflow</span><div class="quick-workflows">'+types.map(type=>'<button type="button" data-create-workflow="'+escapeHtml(type)+'" title="Create '+escapeHtml(type)+' task">'+escapeHtml(type)+'</button>').join('')+'</div></div>'+button('Continue','composerCreate','')+'</div></div><p class="composer-help">Creates a draft task for review. AI generation is not connected.</p></section>'+
 signed+'<div class="home-bottom"><s-section heading="Recent tasks"><div class="panelhead"><p class="slim">Pick up where you left off</p>'+button('View all','all')+'</div>'+(recent.length?taskTable(recent):'<div class="empty">No tasks yet. Choose a workflow above to create your first brief.</div>')+'</s-section></div>';
}
function taskList(){
 const workflow=state.workflowFilter;
 const filtered=tasks.filter(t=>(state.filter==='All'||t.status===state.filter)&&(!workflow||t.workflow===workflow)&&(!state.search||[t.title,t.brand,t.workflow,t.brief,t.url].some(v=>String(v||'').toLowerCase().includes(state.search))));
 const context=workflow?'<section class="workflow-context"><h2>'+escapeHtml(workflow==='LDP'?'Landing pages':workflow==='UGC'?'UGC materials':workflow)+'</h2><p>'+escapeHtml(({Onepage:'Create and manage a product-specific Onepage brief, content review and material QA.',LDP:'Organize a landing page brief around niche, recipient, occasion, collections and featured items.',UGC:'Prepare UGC concepts, image requirements, creative feedback and exportable briefs.','Scale Store Brand':'Record brand-specific UI guidance, research references and implementation tasks.'})[workflow])+'</p><div class="actions">'+button('＋ Create '+escapeHtml(workflow)+' task','createFiltered','')+button('View all tasks','clearWorkflow')+'</div><p class="composer-help">Task planning and review are active. AI execution, rendering and automatic publishing are not available.</p></section>':'';
 return context+'<s-section heading="'+(workflow?escapeHtml(workflow)+' tasks':'All tasks')+'"><div class="panelhead"><div><p class="slim">Select a task to edit or review it</p></div>'+button('＋ New task',workflow?'createFiltered':'create','')+'</div><div class="filters">'+['All',...statuses].map(s=>'<button class="'+(state.filter===s?'active':'')+'" data-filter="'+s+'">'+s+'</button>').join('')+'</div>'+(filtered.length?taskTable(filtered.sort((a,b)=>b.updatedAt-a.updatedAt)) :'<div class="empty">'+(workflow?'No '+escapeHtml(workflow)+' tasks yet. Use Create to start a brief.':'No tasks in this category.')+'</div>')+'</s-section>';
}
function taskEditor(t){const fresh=!t; t=t||{id:'',title:state.prefillTitle||'',brand:state.prefillBrand||'PawfectHouse',workflow:state.prefillWorkflow||'Onepage',url:state.prefillSource||'',brief:state.prefillBrief||'',content:'',feedback:'',status:'Draft'};return '<s-section heading="'+(fresh?'Create creative task':'Task workspace')+'"><div class="panelhead"><div><p class="slim">'+(fresh?'Add a brief to start a traceable task':'Edit brief, content draft, feedback and approval status')+'</p></div>'+(fresh?'':'<span class="badge">'+escapeHtml(t.id)+'</span>')+'</div>'+
'<div class="task-setup-intro"><div class="setup-eyebrow">TASK SETUP</div><p>We’ve separated the product and workflow from your request. Check the details and save when ready.</p></div>'+polarisField('title','Task name',t.title,'e.g. LED Bottle Light Topper · Onepage')+
'<div class="grid" style="grid-template-columns:1fr 1fr;gap:12px"><div>'+polarisSelect('brand','Brand',brands,t.brand)+'</div><div>'+polarisSelect('workflow','Workflow',types,t.workflow)+'</div></div>'+
polarisField('url','Product / collection name or URL',t.url,'e.g. LED Bottle Light Topper or https://...')+
'<div class="row" style="margin:4px 0 10px">'+button('Verify on store','lookup')+'<span class="slim">Find and confirm a real matching product or collection before production.</span></div><div id="catalogMatches" role="status" aria-live="polite"></div>'+
(fresh?'<details class="original-request"><summary>Original request & additional notes <span class="optional-label">Edit if needed</span></summary>'+polarisArea('brief','Request / creative direction',t.brief,'Add direction, requirements or references...')+'</details>':polarisArea('brief','Brief / Creative direction',t.brief,'Product truth, target buyer, angle, constraints, references...'))+
(!fresh?polarisArea('content','Content draft',t.content,'Edit content draft...')+polarisArea('feedback','Feedback & QA notes',t.feedback,'Review notes, issues, revision request...')+polarisSelect('status','Status',statuses,t.status):'')+
'<div class="actions">'+button(fresh?'Save task & open workspace':'Save changes','save','')+(!fresh?button('Version history','history')+button('Export JSON','export')+button('Delete task','delete','danger'):'')+'</div>'+
(!fresh?'<div id="versions" class="space"></div>':'')+(!fresh?'<p class="notice">AI generation is not enabled. Review and materials workflow remain manual until a supported integration is approved.</p>':'')+'</s-section>';}
function settings(){return '<s-section heading="Workspace settings"><p class="lead">UID Brands Studio operates independently from Shopify admin and the existing UID Brands gateway.</p><s-banner tone="info" heading="AI API is disabled"><s-paragraph>No OpenAI API credentials are configured. Task management, content editing and review work without paid AI execution.</s-paragraph></s-banner><div class="space"><s-section heading="Data and access"><s-paragraph>'+(state.cloud?'Task drafts are stored in Supabase and protected by user ownership and team membership.':'Local task drafts are stored only in this browser.')+'</s-paragraph></s-section></div><div class="space"><s-section heading="Platform"><s-paragraph>UI components: Shopify Polaris Web Components 2.0. Runs as a standalone Render web app and does not use Shopify App Bridge or impersonate Shopify Admin.</s-paragraph></s-section></div></s-section>';}
function loginScreen(){
 return '<div class="panel" style="max-width:480px;margin:38px auto"><div class="eyebrow">PRIVATE TEAM WORKSPACE</div><h2 style="font-size:26px;margin-top:10px">Sign in to UID Brands</h2><p class="lead">Sign in using an existing Supabase Auth account added to the Creative DNA team. Contact the UID Brands administrator to provision access.</p>'+label('Email','loginEmail')+field('loginEmail','','you@company.com','email')+label('Password','loginPassword')+field('loginPassword','','Your password','password')+'<div class="actions">'+button('Sign in','login','')+'</div><p class="notice">Studio does not create user accounts automatically. Access is protected by team membership and Supabase Row Level Security. Credentials are not stored in this browser.</p></div>';
}
async function cloudRequest(path,method='GET',body){
 let response=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state.auth?{'Authorization':'Bearer '+state.auth.access_token}:{})},body:body?JSON.stringify(body):undefined});
 if((response.status===401||response.status===403)&&state.auth?.refresh_token){
   const refreshed=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.auth.refresh_token})});
   if(refreshed.ok){
    const payload=await refreshed.json();
    state.auth={access_token:payload.access_token,refresh_token:payload.refresh_token};
    state.user=payload.user;
    response=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.auth.access_token},body:body?JSON.stringify(body):undefined});
   }
 }
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'Server error');
 return data;
}
function fromCloud(t){return {...t,url:t.source_url,updatedAt:Date.parse(t.updated_at),createdAt:Date.parse(t.created_at)};}
async function loadCloud(){
 try{const r=await cloudRequest('/api/tasks');tasks=(r.tasks||[]).map(fromCloud);state.selected=null;render();}
 catch(e){toast(e.message); if(/access|login|token|session/i.test(e.message)){state.auth=null;state.user=null;render();}}
}
async function login(){
 const email=el('loginEmail')?.value.trim(),password=el('loginPassword')?.value;
 if(!email||!password)return toast('Nhập email và password.');
 if(state.busy)return;state.busy=true;
 try{
 const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
 const data=await response.json();if(!response.ok)throw Error(data.error||'Login failed');
 state.auth={access_token:data.access_token,refresh_token:data.refresh_token};state.user=data.user;
 document.getElementById('aiPill').textContent='Signed in · '+data.user.role;
 await loadCloud();toast('Signed in successfully.');
 }catch(e){toast(e.message);}finally{state.busy=false;}
}
function signOut(){state.auth=null;state.user=null;tasks=[];state.selected=null;render();toast('Signed out.');}
function record(v){return {...v,source_url:v.url};}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.querySelectorAll('[data-workflow]').forEach(b=>b.classList.toggle('active',state.page==='tasks'&&state.workflowFilter===b.dataset.workflow));const crumb=el('pageCrumb');if(crumb)crumb.textContent=({dashboard:'Home',tasks:'Tasks',create:'Create task',settings:'Settings'})[state.page];const subtitle=el('pageSubtitle');if(subtitle)subtitle.textContent=({dashboard:'Keep track of your creative tasks, reviews and approvals.',tasks:'Review, organize and update your creative work.',create:'Start with a product, collection or an existing URL.',settings:'Manage workspace configuration and access.'})[state.page];el('pageTitle').textContent=({dashboard:'Creative overview',tasks:'Creative tasks',create:'New creative task',settings:'Settings & AI executor'})[state.page];el('newTask').style.display=state.page==='create'?'none':'block';const selected=tasks.find(t=>t.id===state.selected);if(state.cloud&&!state.user){el('view').innerHTML=loginScreen();el('newTask').style.display='none';return;}el('view').innerHTML=state.page==='dashboard'?dashboard():state.page==='settings'?settings():state.page==='create'?taskEditor(null):'<div class="grid"><div>'+taskList()+'</div><div>'+(selected?taskEditor(selected):'<div class="panel"><h2>Task details</h2><p class="lead">Select a task from the list to edit, review, generate content or export.</p></div>')+'</div></div>';}
function values(){return {title:el('title').value.trim(),brand:el('brand').value,workflow:el('workflow').value,url:el('url').value.trim(),brief:el('brief').value.trim(),content:el('content')?.value||'',feedback:el('feedback')?.value||'',status:el('status')?.value||'Draft'};}
function valid(v){if(!v.title||!v.brief){toast('Cần có task name và brief.');return false;}if(v.url.length>2000){toast('Tên hoặc URL quá dài.');return false;}if(v.url.includes('://')&&!/^https:\/\//i.test(v.url)){toast('Link phải bắt đầu bằng https://');return false;}return true;}
const normalizeName=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
async function lookupStore(){
 const source=el('url'),brand=el('brand'),target=el('catalogMatches');
 if(!source||!brand||!target)return;
 const q=String(source.value||'').trim();
 if(!q||q.startsWith('https://')){target.innerHTML=q.startsWith('https://')?'<p class="slim">Đã có URL. Không cần tìm.</p>':'<p class="slim">Nhập tên sản phẩm hoặc collection để tìm.</p>';return;}
 if(q.length<2||q.length>150){target.textContent='Tên tìm kiếm cần từ 2 đến 150 ký tự.';return;}
 if(!state.cloud||!state.auth){target.innerHTML='<p class="slim">Tìm trên store cần đăng nhập UID Brands.</p>';return;}
 target.textContent='Đang tìm '+q+' trên '+brand.value+'…';
 try{
  const result=await cloudRequest('/api/catalog/search?brand='+encodeURIComponent(brand.value)+'&q='+encodeURIComponent(q));
  if(source.value.trim()!==q||brand.value!==result.brand)return;
  const entries=result.results||[];
  if(!entries.length){target.innerHTML='<div class="notice">Không tìm thấy kết quả công khai phù hợp. Anh vẫn có thể lưu tên này làm brief để xử lý sau.</div>';return;}
  const exact=entries.filter(x=>normalizeName(x.title)===normalizeName(q));
  if(exact.length===1){
    source.value=exact[0].url;
    target.innerHTML='<div class="notice">Đã nhận diện '+escapeHtml(exact[0].type)+': <strong>'+escapeHtml(exact[0].title)+'</strong>. URL đã được điền tự động.</div>';
    return;
  }
  target.innerHTML='<div class="subheading">Kết quả trên store — chọn đúng sản phẩm/collection</div>'+entries.map((item,i)=>'<div class="row" style="justify-content:space-between;margin:6px 0;gap:8px"><span class="sectiontext">'+escapeHtml(item.type==='collection'?'Collection':'Product')+' · <strong>'+escapeHtml(item.title)+'</strong></span><s-button variant="secondary" data-catalog-index="'+i+'">Chọn</s-button></div>').join('');
  state.catalogMatches=entries;
 }catch(e){target.innerHTML='<div class="notice">Không thể quét storefront lúc này. Anh vẫn lưu tên được; chưa xác nhận được URL. '+escapeHtml(e.message)+'</div>';}
}
async function persist(){
 const v=values();if(!valid(v)||state.busy)return;
 if(state.cloud){
  state.busy=true;
  try{
   const existing=tasks.find(x=>x.id===state.selected);
   const route=existing?'/api/tasks/'+existing.id:'/api/tasks';
   const result=await cloudRequest(route,existing?'PATCH':'POST',{...record(v),revision:existing?.revision});
   const item=fromCloud(result.task);tasks=existing?tasks.map(t=>t.id===item.id?item:t):[item,...tasks];
   state.selected=item.id;state.page='tasks';render();
   toast(result.versionSaved?'Saved to Supabase with revision history.':'Saved, but revision history was not recorded.');
  }catch(e){toast(e.message);}finally{state.busy=false;}return;
 }
 let t=tasks.find(x=>x.id===state.selected);if(t)Object.assign(t,v,{updatedAt:Date.now()});else{t={...v,id:'UID-'+Date.now().toString(36).toUpperCase(),createdAt:Date.now(),updatedAt:Date.now()};tasks.unshift(t);}save();state.selected=t.id;state.page='tasks';render();toast('Task saved in this browser.');
}
async function showHistory(){
  const t=tasks.find(x=>x.id===state.selected),target=el('versions');
  if(!t||!target)return;
  if(!state.cloud){target.innerHTML='<div class="notice">Version history requires authenticated cloud sync. In local mode, export JSON for backup.</div>';return;}
  target.textContent='Loading version history…';
  try{
    const r=await cloudRequest('/api/tasks/'+t.id+'/versions');
    target.innerHTML='<div class="subheading">Saved versions</div>'+((r.versions||[]).length?r.versions.map(v=>'<div class="task" style="display:block"><div class="row"><strong>Revision '+Number(v.revision)+'</strong><span class="muted">'+new Date(v.created_at).toLocaleString('vi-VN')+'</span></div><p class="slim">'+escapeHtml(v.snapshot?.status||'')+' · '+escapeHtml(v.snapshot?.title||'')+'</p></div>').join(''):'<div class="notice">No version records yet.</div>');
  }catch(e){target.textContent=e.message;}
}
function exportTask(t){const blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=t.id+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function generate(){const t=tasks.find(x=>x.id===state.selected);if(!t)return;if(!state.ai){toast('AI chưa cấu hình. Xem Settings.');return;}if(!state.token){navigate('settings');toast('Nhập Studio access token trước.');return;}const v=values();if(!valid(v))return;const btn=document.querySelector('[data-action="generate"]');btn.disabled=true;btn.textContent='Generating…';try{const response=await fetch('/api/ai/content',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},body:JSON.stringify({brand:v.brand,workflow:v.workflow,brief:'Title: '+v.title+'\nSource URL: '+v.url+'\n'+v.brief})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI request failed');if(!data.output)throw new Error('Empty output');v.content=data.output;v.status='In review';Object.assign(t,v,{updatedAt:Date.now()});save();render();toast('AI draft ready for review.');}catch(e){toast(String(e.message));if(btn){btn.disabled=false;btn.textContent='Generate content with AI';}}}
document.addEventListener('focusout',e=>{if(e.target?.id==='url'&&state.cloud&&state.auth&&el('url')?.value.trim()&&!el('url').value.trim().startsWith('https://'))lookupStore();});
document.addEventListener('change',e=>{if(e.target?.id==='brand'&&state.cloud&&state.auth&&el('url')?.value.trim()&&!el('url').value.trim().startsWith('https://'))lookupStore();});
document.addEventListener('input',e=>{if(e.target?.id==='composerBrief'){state.composerDraft=e.target.value;return;}if(e.target?.id==='taskSearch'){state.search=e.target.value.toLowerCase().trim();if(state.search){state.page='tasks';state.workflowFilter=null;}render();const q=el('taskSearch');if(q&&q.value!==state.search)q.value=state.search;}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();el('taskSearch')?.focus();}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target?.id==='composerBrief'){e.preventDefault();createFromComposer();}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav)return navigate(nav.dataset.page);if(e.target.closest('#newTask'))return navigate('create');const createWorkflow=e.target.closest('[data-create-workflow]');if(createWorkflow){startWorkflow(createWorkflow.dataset.createWorkflow);return;}const workflowLink=e.target.closest('[data-workflow]');if(workflowLink){openWorkflow(workflowLink.dataset.workflow);return;}const item=e.target.closest('[data-select]');if(item)return selectTask(item.dataset.select);const catalog=e.target.closest('[data-catalog-index]');if(catalog){const choice=state.catalogMatches?.[Number(catalog.dataset.catalogIndex)];if(choice&&el('url')){el('url').value=choice.url;el('catalogMatches').innerHTML='<div class="notice">Đã chọn '+escapeHtml(choice.title)+' · '+escapeHtml(choice.url)+'</div>';}return;}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;return render();}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='create')return navigate('create');if(action==='composerCreate')return createFromComposer();if(action==='createFiltered')return startWorkflow(state.workflowFilter||'Onepage');if(action==='clearWorkflow')return navigate('tasks');if(action==='all')return navigate('tasks');if(action==='login')return login();if(action==='logout')return signOut();if(action==='lookup')return lookupStore();if(action==='save')return persist();if(action==='generate')return generate();if(action==='history')return showHistory();if(action==='tokenSave'){state.token=el('token').value;toast('Token kept in current tab only.');return;}const t=tasks.find(x=>x.id===state.selected);if(!t)return;if(action==='export')return exportTask(t);if(action==='delete'&&confirm('Delete '+t.title+'? This cannot be undone.')){if(state.cloud){cloudRequest('/api/tasks/'+t.id,'DELETE').then(r=>{if(!r.deleted)throw Error('Task not deleted');tasks=tasks.filter(x=>x.id!==t.id);state.selected=null;render();toast('Task deleted.');}).catch(e=>toast(e.message));}else{tasks=tasks.filter(x=>x.id!==t.id);state.selected=null;save();render();toast('Task deleted.');}}});
fetch('/api/status').then(r=>r.json()).then(d=>{state.ai=!!d.aiConfigured;state.cloud=!!d.cloudConfigured;el('aiPill').textContent=state.cloud?'Cloud workspace · sign in':'Local workspace';render();}).catch(()=>{el('aiPill').textContent='Server unavailable';});
render();
</script></body></html>
