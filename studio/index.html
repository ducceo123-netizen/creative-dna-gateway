<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>UID Brands Studio — Creative workspace</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211b;background:#f7f9f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e7ece8;padding:26px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:10px;padding:0 12px;font-size:19px;font-weight:800;letter-spacing:-.7px}.logo{background:#b9f4ce;color:#1c5131;border-radius:12px;width:37px;height:37px;display:grid;place-items:center}.menu{display:grid;gap:7px}.menu button{display:flex;align-items:center;text-align:left;gap:11px;border:0;background:transparent;color:#536057;padding:13px 14px;border-radius:11px;font-weight:650}.menu button.active{background:#eaf8ed;color:#1c6740}.hint{color:#768279;font-size:12px;line-height:1.7;padding:15px;border:1px solid #e7ece8;border-radius:12px;margin-top:auto}.main{min-width:0;padding:25px clamp(18px,3vw,48px) 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:27px;border-bottom:1px solid #e4eae5}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#718077;font-weight:750}.top h1{margin:7px 0 0;font-size:29px;letter-spacing:-1.2px}.pill{font-size:12px;font-weight:700;border:1px solid #dbe7dd;border-radius:99px;padding:9px 13px;background:#fff;color:#54715d}.btn{background:#19271e;border:1px solid #19271e;color:#fff;border-radius:10px;padding:11px 17px;font-weight:700;white-space:nowrap}.btn:hover{background:#324739}.btn.secondary{background:#fff;color:#28372e;border:1px solid #dbe5dd}.btn.ghost{background:transparent;border-color:transparent;color:#607266}.btn.danger{color:#ab3d3d;background:#fff;border-color:#eedada}.content{padding-top:26px;max-width:1300px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat,.panel{background:#fff;border:1px solid #e6ebe6;border-radius:15px;box-shadow:0 3px 14px rgba(10,40,20,.025)}.stat{padding:19px 21px}.stat strong{font-size:29px;display:block;letter-spacing:-1px;margin:9px 0 4px}.stat small,.muted{font-size:12px;color:#79867d}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:18px;align-items:start}.panel{padding:22px}.panel h2{font-size:17px;letter-spacing:-.4px;margin:0 0 5px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}.lead{color:#748177;font-size:13px;margin:0 0 18px;line-height:1.6}.task{width:100%;border:1px solid #e9eeea;padding:15px;margin-top:9px;background:#fff;border-radius:12px;text-align:left;display:flex;gap:13px;align-items:center}.task:hover,.task.selected{border-color:#8ad9a6;background:#f6fdf7}.task-icon{background:#e9f8ed;display:grid;place-items:center;border-radius:10px;width:38px;height:38px;font-size:18px;flex:none}.task-body{flex:1;min-width:0}.task-body strong{display:block;font-size:13px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task-body span{color:#79857c;font-size:11px}.status{font-size:11px;border-radius:99px;padding:5px 8px;background:#f0f4f1;color:#556b5c;white-space:nowrap}.status.approved{color:#167b49;background:#e8f7ed}.status.review{color:#996319;background:#fff5e1}.status.draft{color:#657268}.empty{border:1px dashed #d8e4d9;text-align:center;border-radius:13px;padding:40px 16px;color:#7a897d;font-size:13px}.label{display:block;font-size:12px;font-weight:750;margin:15px 0 7px;color:#3a4a40}.input{width:100%;border:1px solid #dfe7df;border-radius:10px;padding:11px 12px;background:#fff;outline:none;color:#23352a}.input:focus{border-color:#59aa79;box-shadow:0 0 0 3px #e3f5e8}.textarea{min-height:132px;resize:vertical;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:19px}.stage{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.stage span{padding:8px 11px;border:1px solid #e2eae3;border-radius:8px;font-size:11px;color:#718078}.stage span.on{border-color:#afe4bf;background:#eaf8ee;color:#236941;font-weight:750}.notice{background:#f5faf5;border:1px solid #e0ebe1;color:#617369;border-radius:10px;padding:13px 14px;font-size:12px;line-height:1.65;margin-top:15px}.preview{white-space:pre-wrap;overflow:auto;max-height:420px;font-size:13px;line-height:1.8;color:#26362b;background:#f8fbf8;padding:16px;border:1px solid #e5ece6;border-radius:10px}.badge{display:inline-block;font-size:11px;background:#ebf8f0;color:#286744;padding:5px 9px;border-radius:99px;font-weight:700}.hidden{display:none!important}#toast{position:fixed;bottom:24px;right:24px;background:#1e3024;color:#fff;padding:13px 20px;border-radius:12px;font-size:12px;box-shadow:0 10px 40px #0003;display:none;max-width:340px}.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}.slim{font-size:12px;color:#75837a;margin:0}.sectiontext{line-height:1.65;color:#67796d;font-size:13px}.line{border:0;border-top:1px solid #edf1ed;margin:21px 0}.subheading{font-size:14px;font-weight:750;margin:18px 0 7px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.filters button{border:1px solid #e1e8e2;background:#fff;padding:8px 12px;border-radius:20px;color:#647467;font-size:12px}.filters button.active{background:#243b2b;color:white}.space{margin-top:17px}@media(max-width:960px){.shell{grid-template-columns:1fr}.sidebar{padding:13px 17px;gap:10px}.sidebar .hint{display:none}.menu{display:flex;overflow:auto}.menu button{white-space:nowrap}.grid{grid-template-columns:1fr}}@media(max-width:620px){.main{padding:17px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:17px}.top h1{font-size:24px}} 
</style></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><div class="logo">✳</div>UID Brands <span style="font-size:10px;color:#7a9080;margin-left:auto">STUDIO</span></div><nav class="menu"><button class="active" data-page="dashboard">▦ &nbsp; Overview</button><button data-page="tasks">☷ &nbsp; All Tasks</button><button data-page="create">✦ &nbsp; Create Task</button><button data-page="settings">⚙ &nbsp; AI & Settings</button></nav><div class="hint">Separate Web App branch<br><strong>webapp/uid-brands-studio-mvp</strong><br>No change to existing MCP gateway.<br><br>Task storage: local fallback or authenticated Supabase (when configured).</div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">CREATIVE OPERATIONS / WORKSPACE</div><h1 id="pageTitle">Creative overview</h1></div><div class="row"><span id="aiPill" class="pill">Checking AI…</span><button class="btn" id="newTask">＋ New Task</button></div></header><section id="view" class="content"></section></main>
</div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='uid_brands_studio_tasks_v1';
const types=['Onepage','LDP','Scale Store Brand','UGC'];
const brands=['PawfectHouse','GiftSoul','SoulPrise'];
const statuses=['Draft','In progress','In review','Approved'];
const iconFor={Onepage:'▣',LDP:'▤','Scale Store Brand':'◈',UGC:'◎'};
const state={page:'dashboard',selected:null,filter:'All',ai:false,cloud:false,auth:null,user:null,token:'',busy:false};
let tasks=[];
try {const stored=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(stored)?stored.filter(x=>x&&typeof x.id==='string'):[];}catch{}
const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{if(state.cloud)return;try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch{toast('Không thể lưu: browser storage đầy hoặc bị chặn.');}};
function toast(m){const n=el('toast');n.textContent=m;n.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>n.style.display='none',3600);}
function statusBadge(s){return '<span class="status '+(s==='Approved'?'approved':s==='In review'?'review':'draft')+'">'+escapeHtml(s)+'</span>';}
function label(text,field){return '<label class="label" for="'+field+'">'+text+'</label>';}
function field(id,value,placeholder='',type='text'){return '<input class="input" id="'+id+'" type="'+type+'" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(placeholder)+'"/>';}
function textarea(id,value,placeholder=''){return '<textarea class="input textarea" id="'+id+'" placeholder="'+escapeHtml(placeholder)+'">'+escapeHtml(value)+'</textarea>';}
function options(list,val){return list.map(x=>'<option '+(x===val?'selected':'')+'>'+escapeHtml(x)+'</option>').join('');}
function button(text,act,cls='secondary'){return '<button class="btn '+cls+'" data-action="'+act+'">'+text+'</button>';}
function selectTask(id){state.selected=id;state.page='tasks';render();}
function navigate(page){state.page=page;if(page==='create')state.selected=null;render();}
function taskRow(t){return '<button class="task '+(state.selected===t.id?'selected':'')+'" data-select="'+t.id+'"><span class="task-icon">'+iconFor[t.workflow]+'</span><span class="task-body"><strong>'+escapeHtml(t.title)+'</strong><span>'+escapeHtml(t.brand)+' · '+escapeHtml(t.workflow)+' · '+new Date(t.updatedAt).toLocaleDateString('vi-VN')+'</span></span>'+statusBadge(t.status)+'</button>';}
function stats(){return '<div class="stats">'+[['Total tasks',tasks.length],['In progress',tasks.filter(t=>t.status==='In progress').length],['In review',tasks.filter(t=>t.status==='In review').length],['Approved',tasks.filter(t=>t.status==='Approved').length]].map(([name,value])=>'<div class="stat"><div class="eyebrow">'+name+'</div><strong>'+value+'</strong><small>'+(state.cloud?'Cloud · secured':'Local workspace')+'</small></div>').join('')+'</div>';}
function dashboard(){const recent=[...tasks].sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,6);return stats()+(state.cloud?'<div class="row" style="margin-bottom:15px"><span class="badge">Signed in: '+escapeHtml(state.user?.email||'')+'</span>'+button('Sign out','logout')+'</div>':'')+'<div class="grid"><div class="panel"><div class="panelhead"><div><h2>Recent creative tasks</h2><p class="slim">Continue where you left off</p></div>'+button('View all','all')+'</div>'+(recent.length?recent.map(taskRow).join(''):'<div class="empty">No tasks yet. Create a Onepage or LDP brief to start.</div>')+'</div><div class="panel"><h2>Studio workflow</h2><p class="lead">One workspace for brief, content, feedback and QA.</p><div class="stage"><span class="on">01 Brief</span><span>02 Research</span><span>03 Content</span><span>04 Materials</span><span>05 Review</span></div><p class="sectiontext">Tasks are '+(state.cloud?'saved to Supabase with per-member access and revisions':'saved locally in this browser')+'. Optional AI is disabled until separately configured and approved.</p>'+button('Create a task','create','')+'<div class="notice">The original gateway and MCP tools remain a separate deployment. Studio does not change or publish store content.</div></div></div>';}
function taskList(){const filtered=state.filter==='All'?tasks:tasks.filter(t=>t.status===state.filter);return '<div class="panel"><div class="panelhead"><div><h2>All tasks</h2><p class="slim">Select a task to edit or review it</p></div>'+button('＋ New task','create','')+'</div><div class="filters">'+['All',...statuses].map(s=>'<button class="'+(state.filter===s?'active':'')+'" data-filter="'+s+'">'+s+'</button>').join('')+'</div>'+(filtered.length?filtered.sort((a,b)=>b.updatedAt-a.updatedAt).map(taskRow).join(''):'<div class="empty">No tasks in this category.</div>')+'</div>';}
function taskEditor(t){const fresh=!t; t=t||{id:'',title:'',brand:'PawfectHouse',workflow:'Onepage',url:'',brief:'',content:'',feedback:'',status:'Draft'};return '<div class="panel"><div class="panelhead"><div><h2>'+(fresh?'Create creative task':'Task workspace')+'</h2><p class="slim">'+(fresh?'Add a brief to start a traceable task':'Edit brief, content draft, feedback and approval status')+'</p></div>'+(fresh?'':'<span class="badge">'+escapeHtml(t.id)+'</span>')+'</div>'+
label('Task name','title')+field('title',t.title,'e.g. Christmas Bone Stockings Onepage')+
'<div class="grid" style="grid-template-columns:1fr 1fr;gap:12px"><div>'+label('Brand','brand')+'<select class="input" id="brand">'+options(brands,t.brand)+'</select></div><div>'+label('Workflow','workflow')+'<select class="input" id="workflow">'+options(types,t.workflow)+'</select></div></div>'+
label('PDP / Collection / Website URL','url')+field('url',t.url,'https://example.com/products/...','url')+
label('Brief / Creative direction','brief')+textarea('brief',t.brief,'Product truth, target buyer, angle, constraints, references...')+
(!fresh?label('Content draft / AI output','content')+textarea('content',t.content,'Generated copy or manually edited draft...')+label('Feedback & QA notes','feedback')+textarea('feedback',t.feedback,'Review notes, issues, revision request...')+label('Status','status')+'<select id="status" class="input">'+options(statuses,t.status)+'</select>':'')+
'<div class="actions">'+button(fresh?'Create task':'Save changes','save','')+(!fresh?button('Generate content with AI','generate')+button('Export JSON','export')+button('Delete task','delete','danger'):'')+'</div>'+
(!fresh?'<p class="notice">AI generation requires a server-side OpenAI API key plus Studio access token. No API usage occurs unless you explicitly press Generate and the server is configured.</p>':'')+'</div>';}
function settings(){return '<div class="panel" style="max-width:750px"><h2>AI executor & security</h2><p class="lead">API credentials must remain on the Render server, never in the browser. The Studio token is entered per session and is not saved.</p><div class="notice">AI executor: <strong>'+(state.ai?'Configured · access token required':'Not configured')+'</strong>. This is an independent API service; ChatGPT subscriptions are not connected to a third-party app as an API.</div>'+label('Studio access token (session only)','token')+field('token',state.token,'Enter server-side STUDIO_ACCESS_TOKEN','password')+'<div class="actions">'+button('Use token for this session','tokenSave','')+'</div><hr class="line"><h3 class="subheading">Deploy environment</h3><p class="sectiontext">For AI content generation, an operator sets OPENAI_API_KEY and STUDIO_ACCESS_TOKEN in the separate Render Studio service. Without both, the Generate action remains unavailable. Do not put keys in the frontend or GitHub.</p><h3 class="subheading">Current data scope</h3><p class="sectiontext">When cloud mode is configured, each signed-in team member sees their own tasks under RLS. It is NOT a shared team queue yet. Local mode uses browser storage. Research crawler, image generation and ZIP export remain future milestones.</p></div>';}
function loginScreen(){
 return '<div class="panel" style="max-width:480px;margin:38px auto"><div class="eyebrow">PRIVATE TEAM WORKSPACE</div><h2 style="font-size:26px;margin-top:10px">Sign in to UID Brands</h2><p class="lead">Sign in using an existing Supabase Auth account added to the Creative DNA team. Contact the UID Brands administrator to provision access.</p>'+label('Email','loginEmail')+field('loginEmail','','you@company.com','email')+label('Password','loginPassword')+field('loginPassword','','Your password','password')+'<div class="actions">'+button('Sign in','login','')+'</div><p class="notice">Studio does not create user accounts automatically. Access is protected by team membership and Supabase Row Level Security. Credentials are not stored in this browser.</p></div>';
}
async function cloudRequest(path,method='GET',body){
 const response=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state.auth?{'Authorization':'Bearer '+state.auth.access_token}:{})},body:body?JSON.stringify(body):undefined});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'Server error');
 return data;
}
function fromCloud(t){return {...t,url:t.source_url,updatedAt:Date.parse(t.updated_at),createdAt:Date.parse(t.created_at)};}
async function loadCloud(){
 try{const r=await cloudRequest('/api/tasks');tasks=(r.tasks||[]).map(fromCloud);state.selected=null;render();}
 catch(e){toast(e.message); if(/access|login|token|session/i.test(e.message)){state.auth=null;state.user=null;render();}}
}
async function login(){
 const email=el('loginEmail')?.value.trim(),password=el('loginPassword')?.value;
 if(!email||!password)return toast('Nhập email và password.');
 if(state.busy)return;state.busy=true;
 try{
 const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
 const data=await response.json();if(!response.ok)throw Error(data.error||'Login failed');
 state.auth={access_token:data.access_token,refresh_token:data.refresh_token};state.user=data.user;
 document.getElementById('aiPill').textContent='Signed in · '+data.user.role;
 await loadCloud();toast('Signed in successfully.');
 }catch(e){toast(e.message);}finally{state.busy=false;}
}
function signOut(){state.auth=null;state.user=null;tasks=[];state.selected=null;render();toast('Signed out.');}
function record(v){return {...v,source_url:v.url};}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));el('pageTitle').textContent=({dashboard:'Creative overview',tasks:'Creative tasks',create:'New creative task',settings:'Settings & AI executor'})[state.page];el('newTask').style.display=state.page==='create'?'none':'block';const selected=tasks.find(t=>t.id===state.selected);if(state.cloud&&!state.user){el('view').innerHTML=loginScreen();el('newTask').style.display='none';return;}el('view').innerHTML=state.page==='dashboard'?dashboard():state.page==='settings'?settings():state.page==='create'?taskEditor(null):'<div class="grid"><div>'+taskList()+'</div><div>'+(selected?taskEditor(selected):'<div class="panel"><h2>Task details</h2><p class="lead">Select a task from the list to edit, review, generate content or export.</p></div>')+'</div></div>';}
function values(){return {title:el('title').value.trim(),brand:el('brand').value,workflow:el('workflow').value,url:el('url').value.trim(),brief:el('brief').value.trim(),content:el('content')?.value||'',feedback:el('feedback')?.value||'',status:el('status')?.value||'Draft'};}
function valid(v){if(!v.title||!v.brief){toast('Cần có task name và brief.');return false;}if(v.url&&(!/^https:\/\//i.test(v.url)||v.url.length>2000)){toast('URL phải bắt đầu bằng https://');return false;}return true;}
async function persist(){
 const v=values();if(!valid(v)||state.busy)return;
 if(state.cloud){
  state.busy=true;
  try{
   const existing=tasks.find(x=>x.id===state.selected);
   const route=existing?'/api/tasks/'+existing.id:'/api/tasks';
   const result=await cloudRequest(route,existing?'PATCH':'POST',{...record(v),revision:existing?.revision});
   const item=fromCloud(result.task);tasks=existing?tasks.map(t=>t.id===item.id?item:t):[item,...tasks];
   state.selected=item.id;state.page='tasks';render();
   toast(result.versionSaved?'Saved to Supabase with revision history.':'Saved, but revision history was not recorded.');
  }catch(e){toast(e.message);}finally{state.busy=false;}return;
 }
 let t=tasks.find(x=>x.id===state.selected);if(t)Object.assign(t,v,{updatedAt:Date.now()});else{t={...v,id:'UID-'+Date.now().toString(36).toUpperCase(),createdAt:Date.now(),updatedAt:Date.now()};tasks.unshift(t);}save();state.selected=t.id;state.page='tasks';render();toast('Task saved in this browser.');
}
function exportTask(t){const blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=t.id+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function generate(){const t=tasks.find(x=>x.id===state.selected);if(!t)return;if(!state.ai){toast('AI chưa cấu hình. Xem Settings.');return;}if(!state.token){navigate('settings');toast('Nhập Studio access token trước.');return;}const v=values();if(!valid(v))return;const btn=document.querySelector('[data-action="generate"]');btn.disabled=true;btn.textContent='Generating…';try{const response=await fetch('/api/ai/content',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},body:JSON.stringify({brand:v.brand,workflow:v.workflow,brief:'Title: '+v.title+'\nSource URL: '+v.url+'\n'+v.brief})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI request failed');if(!data.output)throw new Error('Empty output');v.content=data.output;v.status='In review';Object.assign(t,v,{updatedAt:Date.now()});save();render();toast('AI draft ready for review.');}catch(e){toast(String(e.message));if(btn){btn.disabled=false;btn.textContent='Generate content with AI';}}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav)return navigate(nav.dataset.page);if(e.target.closest('#newTask'))return navigate('create');const item=e.target.closest('[data-select]');if(item)return selectTask(item.dataset.select);const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;return render();}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='create')return navigate('create');if(action==='all')return navigate('tasks');if(action==='login')return login();if(action==='logout')return signOut();if(action==='save')return persist();if(action==='generate')return generate();if(action==='tokenSave'){state.token=el('token').value;toast('Token kept in current tab only.');return;}const t=tasks.find(x=>x.id===state.selected);if(!t)return;if(action==='export')return exportTask(t);if(action==='delete'&&confirm('Delete '+t.title+'? This cannot be undone.')){if(state.cloud){cloudRequest('/api/tasks/'+t.id,'DELETE').then(r=>{if(!r.deleted)throw Error('Task not deleted');tasks=tasks.filter(x=>x.id!==t.id);state.selected=null;render();toast('Task deleted.');}).catch(e=>toast(e.message));}else{tasks=tasks.filter(x=>x.id!==t.id);state.selected=null;save();render();toast('Task deleted.');}}});
fetch('/api/status').then(r=>r.json()).then(d=>{state.ai=!!d.aiConfigured;state.cloud=!!d.cloudConfigured;el('aiPill').textContent=state.cloud?'Sign in required':state.ai?'AI available · token required':'Local mode';render();}).catch(()=>{el('aiPill').textContent='Server unavailable';});
render();
</script></body></html>
