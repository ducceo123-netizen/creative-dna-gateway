/* Standalone Shopify-admin shell using official Polaris 2.0 web components. */
s-section{display:block} s-badge{display:inline-flex;vertical-align:middle} s-button{display:inline-flex;vertical-align:middle}
s-table{display:block;width:100%}.polaris-task-table{overflow-x:auto}.polaris-task-row{cursor:pointer}
s-text-field,s-text-area,s-select{display:block;width:100%;margin:12px 0}
s-section{display:block;min-width:0}
.grid>s-section{min-height:100%;background:#fff;border:1px solid #e3e3e3;border-radius:12px}
s-table-row[data-select]{cursor:pointer}
.panelhead{align-items:center}
.panelhead p{margin:0}
main{background:#f1f1f1}
.sidebar .hint{background:#e4e4e4;color:#616161}
.status-tabs{margin:10px 0}
@media(max-width:960px){.grid>s-section{min-height:auto}}
.polaris-kicker{font-size:12px;letter-spacing:0;color:#6a6a6a;text-transform:none}
.polaris-stat-value{font-size:29px;font-weight:700;letter-spacing:-1.2px;margin:8px 0}
.polaris-stat-label{font-size:12px;color:#606060}.polaris-stat{min-height:112px}

/* Shopify home-like lightweight KPI strip and centered task composer */
.home-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid #ededed;padding:3px 0 18px;gap:14px}
.home-metric{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.home-metric span{font-size:12px;color:#737373}
.home-metric strong{font-size:18px;line-height:1.2;font-weight:720;letter-spacing:-.035em}
.welcome-hero{text-align:center;padding:clamp(38px,5vw,85px) 0 72px;margin:0 auto;max-width:850px}

.welcome-hero>p{font-size:clamp(17px,1.5vw,22px);color:#343434;letter-spacing:-.03em;margin:0 0 25px;font-weight:500}

.composer-bottom{display:flex;align-items:center;justify-content:space-between}
.composer-mark{font-size:20px;color:#6256ba}

.home-bottom{max-width:1000px;margin:0 auto}

.workspace-chip{color:#787878;font-size:12px}

/* Shopify Admin-style visual shell: matching reference silhouette, not fake Shopify metrics. */
:root{background:#0b0b0b;color:#303030;--ink:#303030;--canvas:#f7f7f7;--border:#e3e3e3}
html,body{height:100%;background:#0b0b0b}
.shell{grid-template-columns:244px minmax(0,1fr);min-height:100vh;background:#0b0b0b;gap:0}
.sidebar{position:sticky;top:0;height:100vh;min-height:540px;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px 12px;gap:15px;background:#0b0b0b;border:0;color:#ededed;box-shadow:none}
.sidebar-top{display:grid;gap:18px}
.brand{color:#fff;padding:0 9px;font-size:14px;letter-spacing:-.02em;font-weight:700;gap:10px;min-height:34px}
.logo{width:29px;height:29px;border-radius:8px;background:#95bf47;color:#112512;font-size:19px;display:grid;place-items:center}
.brand-collapse{margin-left:auto;font-size:18px;color:#969696;font-weight:400}
.nav-search{display:flex;align-items:center;gap:9px;min-height:36px;padding:0 10px;background:#252525;border:1px solid #353535;border-radius:9px;color:#a5a5a5;cursor:text}
.nav-search>span{font-size:22px;line-height:1}
.nav-search input{width:100%;flex:1;min-width:0;color:#eee;border:0;outline:0;background:transparent;font-size:12px;padding:0}
.nav-search input::placeholder{color:#939393}
.nav-search kbd{font-size:10px;color:#aaa;white-space:nowrap}
.sidebar .menu{display:flex;flex-direction:column;gap:2px;padding:0;overflow:visible}
.sidebar .menu button{min-height:33px;padding:7px 10px;color:#c9c9c9;background:transparent;border:0;border-radius:8px;font-size:13px;font-weight:500;letter-spacing:-.01em;line-height:18px;gap:10px}
.sidebar .menu button:hover{background:#222;color:#fff}
.sidebar .menu button.active{background:#292929;color:#fff;font-weight:650}
.nav-ico{width:18px;flex:none;font-size:17px;display:inline-grid;place-items:center;color:#979797;font-weight:400}
.sidebar .menu button.active .nav-ico{color:#eee}
.nav-heading{font-size:11px;letter-spacing:.02em;color:#929292;margin:20px 10px 6px;font-weight:500}
.sidebar-bottom{margin-top:auto;display:flex;align-items:center;gap:9px;padding:13px 9px 2px;border-top:1px solid #272727}
.workspace-avatar{height:28px;width:28px;display:grid;place-items:center;border-radius:8px;background:#95bf47;color:#163e1e;font-weight:750;font-size:12px}
.workspace-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.workspace-info strong{font-size:12px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace-info span{color:#aaa;font-size:11px}
.workspace-dots{font-size:11px;color:#aaa}
.workspace-frame{background:#fff;border-radius:18px 0 0 18px;min-width:0;margin:4px 4px 4px 0;min-height:calc(100vh - 8px);box-shadow:0 4px 24px #0001;overflow:hidden}
.main{max-width:none;min-width:0;margin:0;padding:0;background:#fff;min-height:calc(100vh - 8px)}
.top{border:0;padding:26px clamp(24px,3.8vw,64px) 18px;align-items:center;background:#fff}
.heading-block{min-width:0}
.top h1{font-size:25px;font-weight:680;letter-spacing:-.035em;line-height:1.22;margin:9px 0 5px;color:#202020}
.polaris-kicker{font-size:12px;color:#737373;font-weight:500}
.crumb-separator{padding:0 7px;color:#aaa}
.page-subtitle{font-size:13px;color:#7b7b7b;margin:0;line-height:1.5}
.header-actions{display:flex;gap:12px;align-items:center}
.pill{color:#5c5c5c;background:#f6f6f6;border:1px solid #e9e9e9;font-size:11px;padding:7px 12px;font-weight:500}
.content{padding:14px clamp(24px,3.8vw,64px) 64px;max-width:1480px;margin:0 auto}
.stats{gap:14px;margin-bottom:23px}
.polaris-stat{border:1px solid #e7e7e7;border-radius:12px;background:#fff;box-shadow:0 1px 2px #00000005;min-height:116px}
.polaris-stat-value{font-size:28px;color:#252525}
.polaris-stat-label{font-size:11px;color:#939393}

.review-frame-stage{display:flex;justify-content:center;background:#e9e9e9;padding:13px;border-radius:10px;min-width:0;overflow:auto;max-height:calc(100vh - 245px)}
.review-frame-stage iframe{width:100%;min-width:0;border:0;background:white;box-shadow:0 3px 18px #00000016;min-height:850px;display:block}
.review-frame-stage.mobile iframe{width:390px;max-width:100%;flex:none}
.review-template-loading{background:#fff;padding:40px 20px;border-radius:8px;text-align:center;font-size:12px;color:#888}
.review-preview-disclaimer{font-size:10px;color:#888;line-height:1.5;padding:11px 2px}
.task-review-inspector{position:sticky;top:12px;max-height:calc(100vh - 35px);overflow:auto;background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:15px}
.review-feedback-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.review-feedback-head h3{font-size:17px;text-transform:capitalize;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.review-feedback-count{font-size:10px;border:1px solid #e7e7e7;border-radius:30px;padding:6px 9px;color:#777;white-space:nowrap}
.review-feedback-panel .research-note{font-size:11px;color:#858585;margin:12px 0}
.review-label{display:block;font-size:11px;font-weight:650;margin:11px 0 5px;color:#666}
.review-feedback-panel select,.review-feedback-panel input,.review-feedback-panel textarea{display:block;width:100%;border:1px solid #dedede;border-radius:8px;background:white;padding:9px;font-size:12px;color:#333;box-sizing:border-box}
.review-feedback-panel textarea{resize:vertical;min-height:83px}
.review-feedback-actions{margin:12px 0}
.review-grouped-feedback{border-top:1px solid #eee;margin-top:14px;padding-top:10px}
.review-feedback-group{padding-bottom:9px;border-bottom:1px solid #f2f2f2;margin-bottom:9px}
.review-feedback-group>strong{font-size:12px}
.review-feedback-note{background:#f8f8f8;border-radius:8px;padding:10px;margin:7px 0}
.review-feedback-note.resolved{opacity:.6}
.review-feedback-note small{font-size:10px;color:#858585}
.review-feedback-note p{font-size:11px;color:#444;line-height:1.5;margin:7px 0}
.review-feedback-note button{border:0;background:none;padding:0;color:#346c4a;font-size:10px;cursor:pointer}
.review-advanced{margin-top:17px;border-top:1px solid #e9e9e9;padding-top:13px}
.review-advanced>summary{cursor:pointer;font-size:12px;font-weight:700;color:#464646}
.review-advanced>summary span{font-size:10px;color:#888;font-weight:400;float:right}
.review-advanced-inner{margin-top:12px}
.review-advanced-inner s-section{padding:0!important}
.review-advanced-inner .grid{grid-template-columns:1fr!important}
.review-advanced-inner .panelhead{flex-wrap:wrap}
.review-advanced-inner .badge{max-width:100%;word-break:break-all}
@media(max-width:1250px){.task-review-layout{grid-template-columns:155px minmax(0,1fr) 275px;gap:9px}.review-task-rail,.task-review-inspector{padding:10px}.task-review-center{padding:10px}}
@media(max-width:970px){.task-review-layout{grid-template-columns:minmax(0,1fr) 280px}.review-task-rail{grid-column:1/-1;position:static;max-height:none}.review-task-list{flex-direction:row;overflow-x:auto}.review-task-card{min-width:185px}.task-review-inspector{position:static;max-height:none}}
@media(max-width:690px){.task-review-layout{grid-template-columns:1fr}.task-review-inspector{grid-row:2}.task-review-center{grid-row:3}.review-frame-stage{max-height:800px}}

.review-asset-mapping{padding:9px 0 13px;border-bottom:1px solid #ededed}
.review-asset-mapping summary{font-size:11px;color:#4b5b4e;font-weight:650;cursor:pointer;margin:9px 0}
.review-asset-mapping select{padding:8px;margin:7px 0 9px}
.review-map-list{max-height:230px;overflow-y:auto;padding:5px 4px;background:#fafafa;border-radius:8px}
.review-map-list label{display:block;padding:7px;border-bottom:1px solid #eee}
.review-map-list label span{font-size:10px;color:#666;display:block}
.review-asset-mapping s-button{margin-top:8px}

<script>
'use strict';
const KEY='uid_brands_studio_tasks_v1';
const types=['Onepage','LDP','Scale Store Brand','UGC'];
const brands=['PawfectHouse','GiftSoul','SoulPrise'];
const statuses=['Draft','In progress','In review','Approved'];
const iconFor={Onepage:'▣',LDP:'▤','Scale Store Brand':'◈',UGC:'◎'};
const state={page:'dashboard',selected:null,filter:'All',workflowFilter:null,composerWorkflow:null,prefillWorkflow:null,prefillBrief:'',prefillTitle:'',prefillSource:'',prefillBrand:'PawfectHouse',prefillKind:'unknown',composerDraft:'',search:'',pendingFiles:[],signupMode:false,signupNotice:'',savedAttachments:{},attachmentPreviews:{},researchPacks:{},deliverables:{},sectionFeedback:{},onepageBindings:{},selectedSection:'hero',onepageTemplate:null,onepageTemplateError:'',onepageFrameMode:'desktop',pipelineRuns:{},pipelineBusy:false,pipelineProgress:'',pipelineSelectedSlots:['banner_desktop','banner_mobile','pd_main','wyl1','occasion1','ugc1'],hybridBusy:false,overallMode:'desktop',executionMode:'hybrid_bridge',executionModes:[],executionBusy:false,onepagePolicy:null,ai:false,cloud:false,auth:null,user:null,token:'',busy:false};
let tasks=[];
try {const stored=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(stored)?stored.filter(x=>x&&typeof x.id==='string'):[];}catch{}
const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{if(state.cloud)return;try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch{toast('Không thể lưu: browser storage đầy hoặc bị chặn.');}};
function toast(m){const n=el('toast');n.textContent=m;n.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>n.style.display='none',3600);}
function statusBadge(s){const tone=s==='Approved'?'success':s==='In review'?'warning':s==='In progress'?'info':'auto';return '<s-badge tone="'+tone+'">'+escapeHtml(s)+'</s-badge>';}
function label(text,field){return '<label class="label" for="'+field+'">'+text+'</label>';}
function field(id,value,placeholder='',type='text'){return '<input class="input" id="'+id+'" type="'+type+'" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(placeholder)+'"/>';}
function textarea(id,value,placeholder=''){return '<textarea class="input textarea" id="'+id+'" placeholder="'+escapeHtml(placeholder)+'">'+escapeHtml(value)+'</textarea>';}
function options(list,val){return list.map(x=>'<s-option value="'+escapeHtml(x)+'" '+(x===val?'selected':'')+'>'+escapeHtml(x)+'</s-option>').join('');}
function polarisField(id,labelText,value,placeholder=''){return '<s-text-field id="'+id+'" label="'+escapeHtml(labelText)+'" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(placeholder)+'"></s-text-field>';}
function polarisArea(id,labelText,value,placeholder=''){return '<s-text-area id="'+id+'" label="'+escapeHtml(labelText)+'" rows="5" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(placeholder)+'"></s-text-area>';}
function polarisSelect(id,labelText,values,value){return '<s-select id="'+id+'" label="'+escapeHtml(labelText)+'" value="'+escapeHtml(value)+'">'+options(values,value)+'</s-select>';}
function button(text,act,cls='secondary'){const variant=cls===''?'primary':'secondary',tone=cls==='danger'?'critical':'auto';return '<s-button variant="'+variant+'" tone="'+tone+'" data-action="'+act+'">'+text+'</s-button>';}
function selectTask(id){state.selectedSection='hero';state.selected=id;state.page='tasks';state.pendingFiles=[];state.overallMode='desktop';state.pipelineProgress='';render();loadTaskResearch(id);loadTaskAttachments(id);hybridLoad(id);pipelineLoad(id);loadSectionFeedback(id);if(tasks.find(t=>t.id===id)?.workflow==='Onepage'){loadOnepageTemplate();loadOnepageBindings(id);}}
function navigate(page){
 // All Create task entry points from Home preserve the user's typed request.
 if(page==='create'&&state.page==='dashboard'){
   const typed=String(el('composerBrief')?.value??state.composerDraft??'').trim();
   if(typed){createFromComposer();return;}
 }
 state.page=page;
 if(page==='create')state.selected=null;
 else {state.prefillWorkflow=null;state.prefillBrief='';state.prefillTitle='';state.prefillSource='';state.prefillBrand='PawfectHouse';state.prefillKind='unknown';}
 if(page==='tasks')state.workflowFilter=null;
 render();
}
function openWorkflow(workflow){
 if(!types.includes(workflow))return;
 state.workflowFilter=workflow;state.filter='All';state.selected=null;state.page='tasks';render();
}
function startWorkflow(workflow){
 if(!types.includes(workflow))return;
 state.composerWorkflow=workflow;
 state.page='dashboard';render();
}
function intentPreviewMarkup(result){
 return '<span class="preview-key">Đã nhận diện</span> <strong>'+escapeHtml(result.workflow)+'</strong> · '+(result.source?'<span>'+escapeHtml(result.source)+'</span>':'<span class="uncertain">Thêm tên sản phẩm/collection hoặc URL</span>');
}
function updateComposerPreview(){
 const target=el('intentPreview');if(!target)return;
 const brief=String(el('composerBrief')?.value??state.composerDraft??'').trim();
 target.innerHTML=brief?intentPreviewMarkup(parseTaskRequest(brief,state.composerWorkflow)):'';
}
function selectComposerWorkflow(workflow){
 if(!types.includes(workflow))return;
 state.composerWorkflow=state.composerWorkflow===workflow?null:workflow;
 const wrap=el('composerWorkflows');
 wrap?.querySelectorAll?.('[data-create-workflow]').forEach(b=>{
  const active=b.dataset.createWorkflow===state.composerWorkflow;
  b.classList.toggle('active',active);
  b.setAttribute('aria-pressed',String(active));
 });
 updateComposerPreview();
}

function parseTaskRequest(raw,selectedWorkflow=null){
 const input=String(raw||'').replace(/\s+/g,' ').trim();
 const workflow=selectedWorkflow&&types.includes(selectedWorkflow)?selectedWorkflow:
  /scale\s*(store\s*)?brand|brand\s*ui|creative\s*dna/i.test(input)?'Scale Store Brand':
  /\bugc\b|user.generated.content/i.test(input)?'UGC':
  /\bldp\b|landing\s*pages?|landingpage/i.test(input)?'LDP':'Onepage';
 const brand=/\bgift\s*soul\b/i.test(input)?'GiftSoul':/\bsoul\s*prise\b/i.test(input)?'SoulPrise':'PawfectHouse';
 const urlMatch=input.match(/https:\/\/[^\s<>"']+/i);
 const direct=/\b(?:onepage|landing\s*pages?|landingpage|ldp|ugc(?:\s*materials?)?|scale\s*store\s*brand)\s+(?:cho|for|of|về|sản phẩm|collection)\s*[-–—:]?\s*(.+)$/i.exec(input);
 const afterFor=/\b(?:cho|for|of)\s*[-–—:]\s*(.+)$/i.exec(input);
 const named=/\b(?:product|collection|sản phẩm)\s*[:：]\s*(.+)$/i.exec(input);
 let source=(urlMatch?.[0]||direct?.[1]||afterFor?.[1]||named?.[1]||'').trim();
 let kind=/\b(?:dòng\s+sản\s+phẩm|collection|bộ\s+sưu\s+tập|nhóm\s+sản\s+phẩm)\b/i.test(source)?'collection':'unknown';
 // Strip natural-language wrappers only at the beginning, never strip real product words.
 source=source.replace(/^(?:(?:cho|for|of)\s+)?(?:dòng\s+sản\s+phẩm|bộ\s+sưu\s+tập|nhóm\s+sản\s+phẩm|collection|sản\s+phẩm|product)\s*(?:[-–—:]?\s*)/i,'');
 source=source.replace(/^[\s\-–—:]+|[.!?\s]+$/g,'');
 if(source.length>180)source='';
 if(/^https:\/\//i.test(source)){
  try{const url=new URL(source);kind=url.pathname.startsWith('/collections/')?'collection':url.pathname.startsWith('/products/')?'product':'unknown';}catch{}
 }
 const hasSource=Boolean(source)&&!/(^onepage$|^ldp$|^ugc$)/i.test(source);
 let productName=source;
 if(/^https:\/\//i.test(source)){
  try{const url=new URL(source);const part=url.pathname.split('/').filter(Boolean).at(-1)||url.hostname;productName=decodeURIComponent(part).replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}catch{productName='Linked product or collection';}
 }
 productName=productName.replace(/\s+/g,' ').trim();
 return {workflow,brand,kind,source:hasSource?source:'',title:hasSource?productName.slice(0,120)+' · '+workflow:workflow+' · New task',brief:input};
}
function createFromComposer(){
 const input=el('composerBrief');
 const textBrief=String(input?input.value:state.composerDraft||'').trim();
 const brief=textBrief||(state.pendingFiles.length?'Reference files: '+state.pendingFiles.map(x=>x.file.name).join(', ').slice(0,900):'');
 if(!brief){input?.focus();toast('Anh nhập brief hoặc attach file trước khi tạo task.');return;}
 state.composerDraft=brief;
 const intent=parseTaskRequest(brief,state.composerWorkflow);
 state.prefillBrief=intent.brief;
 state.prefillTitle=intent.title;
 state.prefillWorkflow=intent.workflow;
 state.prefillBrand=intent.brand;
 state.prefillKind=intent.kind;
 state.prefillSource=intent.source;
 state.selected=null;state.page='create';render();
 // Store search is intentionally opt-in; broad product results must never be mistaken for a collection.
}

function addAttachments(files){
 if(!state.cloud||!state.auth){toast('Attachments require UID Brands cloud sign-in.');return;}
 const existing=state.pendingFiles.length+(state.selected?(state.savedAttachments[state.selected]||[]).length:0);
 const candidates=Array.from(files||[]);
 let added=0,refused=[];
 for(const file of candidates){
  if(existing+added>=8){refused.push('8-file limit');break;}
  const type=attachmentType(file);
  if(!type){refused.push(file.name+': unsupported type');continue;}
  if(file.size>ATTACH_LIMIT||file.size<1){refused.push(file.name+': max 8 MB');continue;}
  if(state.pendingFiles.some(x=>x.file.name===file.name&&x.file.size===file.size)){continue;}
  // Use browser-provided File only; never store base64 in localStorage or task JSON.
  state.pendingFiles.push({file,url:type.startsWith('image/')?URL.createObjectURL(file):null});
  added++;
 }
 refreshAttachmentTray();
 if(added)toast(added+' attachment(s) ready.');
 if(refused.length)toast(refused.slice(0,2).join('; '));

async function fileRequest(path,method='GET',file=null){
 let headers=state.auth?{'Authorization':'Bearer '+state.auth.access_token}:{};
 if(file)headers['Content-Type']=attachmentType(file);
 let response=await fetch(path,{method,headers,body:file||undefined});
 if(response.status===401&&state.auth?.refresh_token){
  await cloudRequest('/api/auth/me');
  headers.Authorization='Bearer '+state.auth.access_token;
  response=await fetch(path,{method,headers,body:file||undefined});
 }
 if(!response.ok){
  const result=await response.json().catch(()=>({}));
  throw Error(result.error||'Attachment operation failed');
 }
 return response;
}
async function loadTaskAttachments(taskId){

  if(state.selected===taskId){refreshAttachmentTray();if(el('hybridPanel'))el('hybridPanel').innerHTML=hybridMarkup(taskId);}
  for(const file of state.savedAttachments[taskId].filter(x=>String(x.mime||'').startsWith('image/')).slice(0,8)){
   const key=taskId+'|'+file.id;
   if(state.attachmentPreviews[key])continue;
   try {
    const response=await fileRequest('/api/tasks/'+taskId+'/attachments/'+encodeURIComponent(file.id));
    const data=await response.blob();
    if(state.attachmentPreviews[key])URL.revokeObjectURL(state.attachmentPreviews[key]);
    state.attachmentPreviews[key]=URL.createObjectURL(data);
    if(state.selected===taskId){refreshAttachmentTray();refreshCanonicalPreview();}

async function uploadPendingAttachments(taskId){

   item.uploading=true;refreshAttachmentTray();

   uploaded++;
  }catch(e){failed++;item.uploading=false;toast(item.file.name+': '+e.message);}

 ctx.fillStyle='#666';ctx.font=(mobile?13:18)+'px Arial';

 const assets=new Map();
 for(const slot of [...banners,...rows.flat()]){

   assets.set(slot,bitmap);

 }
 function drawFrame(slot,x,y,width,height,label){

  ctx.fillText(label,x+8,y+height+22);
 }
 let y=165;
 drawFrame(banners[0],pad,y,w-pad*2,heroHeight,banners[0].replace('_',' '));
 y+=heroHeight+72;
 for(let i=0;i<rows.length;i++){

function templateAssetFromSlot(asset){

 const override=state.onepageBindings[id]?.[asset];if(override){const found=files.find(f=>f.id===override);return found?state.attachmentPreviews[id+'|'+found.id]:null;}
 const direct=(d.materials||[]).find(x=>x.slot===asset||String(x.notes||'').includes('template_slot:'+asset));
 let mapped=direct;
 if(!mapped){
  const normalized=asset.toLowerCase();
  const key=normalized.includes('banner')?(normalized.includes('mobile')?'banner_mobile':'banner_desktop'):
   normalized.includes('pd_')||normalized.includes('product_detail')?'pd_main':
   normalized.includes('wyl')?'wyl1':
   normalized.includes('occasion')?'occasion1':
   normalized.includes('ugc')?'ugc1':
   normalized.includes('icon')?'icons':null;
  if(key)mapped=(d.materials||[]).find(x=>x.slot===key);
 }
 const file=files.find(f=>f.id===mapped?.file_id);
 return file?state.attachmentPreviews[id+'|'+file.id]:null;

 const parser=new DOMParser(),doc=parser.parseFromString(template.html,'text/html');
 for(const node of doc.querySelectorAll('script,iframe,object,embed'))node.remove();
 const placeholder='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#999" font-size="20">Material not mapped</text></svg>');
 const mapped=state.onepageTemplate.asset_slots;
 for(const node of doc.querySelectorAll('*')){
  const attrs=Array.from(node.attributes||[]);
  let assetName=null;
  for(const attr of attrs){
   if(!attr.value.includes('{{'))continue;
   const tokens=[...attr.value.matchAll(/\{\{([a-z0-9_]+)\}\}/g)].map(x=>x[1]);
   for(const token of tokens){
    const isAsset=mapped.includes(token),value=isAsset?(templateAssetFromSlot(token)||placeholder):'';
    attr.value=attr.value.replace('{{'+token+'}}',value);
    if(isAsset)assetName=token;

   node.setAttribute(attr.name,attr.value);
  }

  else if(node.tagName==='SECTION'||node.className&&typeof node.className==='string'&&/hero|occasion|product.details|why.you|good.to.know|customer|ugc|icon/i.test(node.className)){

function buildHandoff(t,pack){
 const p=pack?.snapshot||pack;
 const products=Array.isArray(p?.products)?p.products:[];
 const parts=[
 'UID BRANDS — HYBRID TASK HANDOFF (manual ChatGPT processing)',
 'Task ID: '+t.id,'Brand: '+t.brand,'Workflow: '+t.workflow,
 'Task: '+t.title,'Source URL: '+t.url,'Original brief: '+t.brief,
 'Research status: '+(p?.status||'not scanned'),
 'Research collected at: '+(p?.scanned_at||'none'),
 'Evidence URL: '+(p?.task_source||t.url),
 'Products collected ('+products.length+' shown):'
 ];
 for(const x of products.slice(0,16)){
  parts.push('- '+x.title+' | '+x.url+' | variants: '+x.variantCount+' | gallery: '+x.images.length+' image links');
  if(x.description)parts.push('  Storefront description: '+x.description.slice(0,430));
  if(Array.isArray(x.variants)&&x.variants.length)parts.push('  Listed options: '+x.variants.slice(0,5).map(v=>v.title).join(' / '));
  if(Array.isArray(x.images)&&x.images.length)parts.push('  Gallery source URLs: '+x.images.slice(0,3).join(' | '));
 }
 const result=hybridValue(t.id);
 for(const e of (result.evidence||[]).slice(0,10))parts.push('External evidence — '+e.url+' | '+(e.title||'No title')+' | '+e.status+' | '+(e.description||e.limitations||'').slice(0,260));
 const openFeedback=(state.sectionFeedback[t.id]||[]).filter(x=>x.status==='open');
 if(openFeedback.length){
  parts.push('GROUPED REVIEW FEEDBACK — preserve other approved sections:');
  const feedbackGroups=openFeedback.reduce((m,x)=>((m[x.group_name]??=[]).push(x),m),{});
  for(const [group,items] of Object.entries(feedbackGroups))
   parts.push('Group '+group+': '+items.map(x=>'['+x.section_id+'] '+x.note).join(' | ').slice(0,2600));
 }
 const fileNames=(state.savedAttachments[t.id]||[]).map(f=>f.name).slice(0,8);
 parts.push('Task attachment filenames (must be attached in ChatGPT separately for visual inspection): '+(fileNames.join(' / ')||'none'));
 if(state.onepagePolicy?.schema_version)parts.push('Shared Onepage QC contract version: '+state.onepagePolicy.schema_version);
 parts.push('Not verified: external reviews, buyer pain points, competitive research, physical/product fidelity, Creative DNA visual gates.');
 parts.push('INSTRUCTION: Continue this UID Brands task with canonical Creative DNA and research gate. Verify missing external evidence before conclusions; choose Good To Know or FAQs only from supported insights. Do not invent products, variants, claims, layouts or generated assets. Return content plus QA findings, and preserve task ID/version. Do not publish.');
 parts.push('HANDOFF BACK TO STUDIO: Return a copy-ready Content Draft / Materials Plan / QA Gaps block. Paste into Hybrid production → ChatGPT result → Studio, click Sync result & QA, link actually uploaded files to slots, then verify desktop/mobile. This is manual handoff; do not assert an automatic sync or image generation occurred.');
 return parts.join('\n').slice(0,14500);
}

async function cloudRequest(path,method='GET',body){
 let response=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state.auth?{'Authorization':'Bearer '+state.auth.access_token}:{})},body:body?JSON.stringify(body):undefined});
 if((response.status===401||response.status===403)&&state.auth?.refresh_token){
   const refreshed=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.auth.refresh_token})});
   if(refreshed.ok){
    const payload=await refreshed.json();
    state.auth={access_token:payload.access_token,refresh_token:payload.refresh_token};
    state.user=payload.user;
    response=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.auth.access_token},body:body?JSON.stringify(body):undefined});
   }
 }
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'Server error');
 return data;
}

function valid(v){if(!v.title||!v.brief){toast('Cần có task name và brief.');return false;}if(v.url.length>2000){toast('Tên hoặc URL quá dài.');return false;}if(v.url.includes('://')&&!/^https:\/\//i.test(v.url)){toast('Link phải bắt đầu bằng https://');return false;}return true;}
const normalizeName=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
async function lookupStore(){
 const source=el('url'),brand=el('brand'),target=el('catalogMatches');
 if(!source||!brand||!target)return;
 const q=String(source.value||'').trim();
 if(!q||q.startsWith('https://')){target.innerHTML=q.startsWith('https://')?'<p class="slim">Đã có URL. Không cần tìm.</p>':'<p class="slim">Nhập tên sản phẩm hoặc collection để tìm.</p>';return;}
 if(q.length<2||q.length>150){target.textContent='Tên tìm kiếm cần từ 2 đến 150 ký tự.';return;}
 if(!state.cloud||!state.auth){target.innerHTML='<p class="slim">Tìm trên store cần đăng nhập UID Brands.</p>';return;}
 target.textContent='Đang tìm '+q+' trên '+brand.value+'…';
 try{
  const result=await cloudRequest('/api/catalog/search?brand='+encodeURIComponent(brand.value)+'&q='+encodeURIComponent(q));
  if(source.value.trim()!==q||brand.value!==result.brand)return;
  const entries=result.results||[];
  if(!entries.length){target.innerHTML='<div class="notice">Không tìm thấy kết quả công khai phù hợp. Anh vẫn có thể lưu tên này làm brief để xử lý sau.</div>';return;}
  // Collection-targeted briefs must not be flooded with unrelated SKU suggestions.
  const kind=state.prefillKind||'unknown';
  const cleanQuery=normalizeName(q);
  const collections=entries.filter(x=>x.type==='collection');
  const products=entries.filter(x=>x.type==='product');
  const chosenPool=kind==='collection'?collections:(collections.length?collections:products);
  const ranked=chosenPool.map(item=>{
    const label=normalizeName(item.title);
    const score=label===cleanQuery?100:label.includes(cleanQuery)?80:cleanQuery.includes(label)?65:0;
    return {...item,score};
  }).filter(item=>item.score>=65).sort((a,b)=>b.score-a.score).slice(0,4);
  if(!ranked.length){
    target.innerHTML='<div class="notice">Chưa tìm thấy '+(kind==='collection'?'collection':'kết quả')+' khớp tên <strong>'+escapeHtml(q)+'</strong>. Anh có thể lưu tên làm brief hoặc dán URL collection chính xác. Không tự chọn sản phẩm khác.</div>';
    state.catalogMatches=[];return;
  }
  if(ranked.length===1&&ranked[0].score===100){
    target.innerHTML='<div class="catalog-match"><span class="badge">Exact match</span><strong>'+escapeHtml(ranked[0].title)+'</strong><s-button variant="secondary" data-catalog-index="0">Dùng URL này</s-button></div>';
    state.catalogMatches=ranked;return;
  }
  target.innerHTML='<div class="subheading">Kết quả phù hợp — xác nhận đúng collection/sản phẩm</div>'+ranked.map((item,i)=>'<div class="catalog-match"><div><span class="muted">'+escapeHtml(item.type)+'</span><strong>'+escapeHtml(item.title)+'</strong></div><s-button variant="secondary" data-catalog-index="'+i+'">Chọn</s-button></div>').join('');
  state.catalogMatches=ranked;
 }catch(e){target.innerHTML='<div class="notice">Không thể quét storefront lúc này. Anh vẫn lưu tên được; chưa xác nhận được URL. '+escapeHtml(e.message)+'</div>';}
}
async function persist(){
 const v=values();if(!valid(v)||state.busy)return;
 if(state.cloud){
  state.busy=true;
  try{
   const existing=tasks.find(x=>x.id===state.selected);
   const route=existing?'/api/tasks/'+existing.id:'/api/tasks';
   const result=await cloudRequest(route,existing?'PATCH':'POST',{...record(v),revision:existing?.revision});
   const item=fromCloud(result.task);tasks=existing?tasks.map(t=>t.id===item.id?item:t):[item,...tasks];
   state.selected=item.id;state.page='tasks';render();loadTaskResearch(item.id);hybridLoad(item.id);pipelineLoad(item.id);loadSectionFeedback(item.id);if(item.workflow==='Onepage'){loadOnepageTemplate();loadOnepageBindings(item.id);}
   const attachmentResult=await uploadPendingAttachments(item.id);
   if(attachmentResult.failed)toast(attachmentResult.uploaded+' saved, '+attachmentResult.failed+' upload(s) failed. Retry attach from task.');
   toast(result.versionSaved?'Saved to Supabase with revision history.':'Saved, but revision history was not recorded.');
  }catch(e){toast(e.message);}finally{state.busy=false;}return;
 }
 let t=tasks.find(x=>x.id===state.selected);if(t)Object.assign(t,v,{updatedAt:Date.now()});else{t={...v,id:'UID-'+Date.now().toString(36).toUpperCase(),createdAt:Date.now(),updatedAt:Date.now()};tasks.unshift(t);}save();state.selected=t.id;state.page='tasks';render();toast(state.pendingFiles.length?'Task saved locally, but attachments require cloud sign-in.':'Task saved in this browser.');
}
async function showHistory(){
  const t=tasks.find(x=>x.id===state.selected),target=el('versions');
  if(!t||!target)return;
  if(!state.cloud){target.innerHTML='<div class="notice">Version history requires authenticated cloud sync. In local mode, export JSON for backup.</div>';return;}
  target.textContent='Loading version history…';
  try{
    const r=await cloudRequest('/api/tasks/'+t.id+'/versions');
    target.innerHTML='<div class="subheading">Saved versions</div>'+((r.versions||[]).length?r.versions.map(v=>'<div class="task" style="display:block"><div class="row"><strong>Revision '+Number(v.revision)+'</strong><span class="muted">'+new Date(v.created_at).toLocaleString('vi-VN')+'</span></div><p class="slim">'+escapeHtml(v.snapshot?.status||'')+' · '+escapeHtml(v.snapshot?.title||'')+'</p></div>').join(''):'<div class="notice">No version records yet.</div>');
  }catch(e){target.textContent=e.message;}
}
function exportTask(t){const blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=t.id+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function generate(){const t=tasks.find(x=>x.id===state.selected);if(!t)return;if(!state.ai){toast('AI chưa cấu hình. Xem Settings.');return;}if(!state.token){navigate('settings');toast('Nhập Studio access token trước.');return;}const v=values();if(!valid(v))return;const btn=document.querySelector('[data-action="generate"]');btn.disabled=true;btn.textContent='Generating…';try{const response=await fetch('/api/ai/content',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},body:JSON.stringify({brand:v.brand,workflow:v.workflow,brief:'Title: '+v.title+'\nSource URL: '+v.url+'\n'+v.brief})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI request failed');if(!data.output)throw new Error('Empty output');v.content=data.output;v.status='In review';Object.assign(t,v,{updatedAt:Date.now()});save();render();toast('AI draft ready for review.');}catch(e){toast(String(e.message));if(btn){btn.disabled=false;btn.textContent='Generate content with AI';}}}

document.addEventListener('change',e=>{if(e.target?.id==='reviewSection'){state.selectedSection=e.target.value;const pane=el('sectionFeedbackPane');if(pane)pane.innerHTML=sectionFeedbackInspector(state.selected);return;}

 if(e.target?.id==='attachmentPicker'){addAttachments(e.target.files);e.target.value='';}
});
document.addEventListener('paste',e=>{
 const target=e.target;
 if(target?.id!=='composerBrief'&&target?.id!=='brief'&&!target?.closest?.('[data-attach-dropzone]'))return;
 const items=Array.from(e.clipboardData?.items||[]);
 const images=items.filter(x=>x.kind==='file'&&String(x.type).startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);
 if(images.length){e.preventDefault();addAttachments(images.map((f,i)=>new File([f],f.name&&f.name!=='image.png'?f.name:'clipboard-'+Date.now()+'-'+i+'.'+({ 'image/webp':'webp','image/jpeg':'jpg','image/gif':'gif' }[f.type]||'png'),{type:f.type}))); }
});
document.addEventListener('dragover',e=>{const zone=e.target.closest?.('[data-attach-dropzone]');if(zone){e.preventDefault();zone.classList.add('is-dragging');}});
document.addEventListener('dragleave',e=>{const zone=e.target.closest?.('[data-attach-dropzone]');if(zone)zone.classList.remove('is-dragging');});
document.addEventListener('drop',e=>{const zone=e.target.closest?.('[data-attach-dropzone]');if(zone){e.preventDefault();zone.classList.remove('is-dragging');addAttachments(e.dataTransfer?.files);}});

document.addEventListener('focusout',e=>{if(e.target?.id==='url'&&state.cloud&&state.auth&&el('url')?.value.trim()&&!el('url').value.trim().startsWith('https://'))lookupStore();});
document.addEventListener('change',e=>{if(e.target?.id==='brand'&&state.cloud&&state.auth&&el('url')?.value.trim()&&!el('url').value.trim().startsWith('https://'))lookupStore();});
document.addEventListener('input',e=>{if(e.target?.id==='composerBrief'){state.composerDraft=e.target.value;updateComposerPreview();return;}if(e.target?.id==='taskSearch'){state.search=e.target.value.toLowerCase().trim();if(state.search){state.page='tasks';state.workflowFilter=null;}render();const q=el('taskSearch');if(q&&q.value!==state.search)q.value=state.search;}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();el('taskSearch')?.focus();}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target?.id==='composerBrief'){e.preventDefault();createFromComposer();}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav)return navigate(nav.dataset.page);const createWorkflow=e.target.closest('[data-create-workflow]');if(createWorkflow){selectComposerWorkflow(createWorkflow.dataset.createWorkflow);return;}const workflowLink=e.target.closest('[data-workflow]');if(workflowLink){openWorkflow(workflowLink.dataset.workflow);return;}const executionChoice=e.target.closest('[data-execution-mode]');if(executionChoice)return changeExecutionMode(executionChoice.dataset.executionMode);
 const viewMode=e.target.closest('[data-review-view]');if(viewMode)return switchReviewView(viewMode.dataset.reviewView);
 const sectionResolve=e.target.closest('[data-feedback-resolve]');if(sectionResolve)return resolveSectionFeedback(sectionResolve.dataset.feedbackResolve);
 const item=e.target.closest('[data-select]');if(item)return selectTask(item.dataset.select);
 const pending=e.target.closest('[data-remove-pending]');if(pending)return removePendingAttachment(Number(pending.dataset.removePending));
 const dl=e.target.closest('[data-download-attachment]');if(dl)return downloadAttachment(dl.dataset.downloadAttachment);
 const remove=e.target.closest('[data-delete-attachment]');if(remove)return deleteAttachment(remove.dataset.deleteAttachment);const catalog=e.target.closest('[data-catalog-index]');if(catalog){const choice=state.catalogMatches?.[Number(catalog.dataset.catalogIndex)];if(choice&&el('url')){el('url').value=choice.url;el('catalogMatches').innerHTML='<div class="notice">Đã chọn '+escapeHtml(choice.title)+' · '+escapeHtml(choice.url)+'</div>';}return;}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;return render();}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='saveOnepageBindings')return saveOnepageBindings();if(action==='copySectionFeedback')return copyGroupedFeedback();if(action==='addSectionFeedback')return addSectionFeedback();if(action==='clearSelection'){state.selected=null;return render();}if(action==='create')return navigate('dashboard');if(action==='composerCreate')return createFromComposer();if(action==='createFiltered')return startWorkflow(state.workflowFilter||'Onepage');if(action==='clearWorkflow')return navigate('tasks');if(action==='all')return navigate('tasks');if(action==='showSignIn'){state.signupMode=false;state.signupNotice='';return render();}if(action==='showSignUp'){state.signupMode=true;state.signupNotice='';return render();}if(action==='signup')return signup();if(action==='login')return login();if(action==='logout')return signOut();if(action==='chooseAttachments')return el('attachmentPicker')?.click();if(action==='lookup')return lookupStore();if(action==='pipelineCapture')return pipelineCapture();if(action==='pipelineStart')return pipelineStart();if(action==='pipelineNext')return pipelineNext();if(action==='pipelineAll')return pipelineAll();if(action==='pipelineHistory')return pipelineHistory();if(action==='pipelineZip')return pipelineExportZip();if(action==='pipelineExport')return pipelineExport();if(action==='executeSelected')return executeSelectedMode();if(action==='hybridSave')return hybridSave();if(action==='hybridEvidence')return hybridEvidence();if(action==='hybridRun')return hybridRun();if(action==='hybridDesktop')return hybridMode('desktop');if(action==='hybridMobile')return hybridMode('mobile');if(action==='scanResearch')return scanTaskResearch();if(action==='copyHandoff')return copyResearchHandoff();if(action==='openChatGPT')return openChatGPTHandoff();if(action==='save')return persist();if(action==='generate')return generate();if(action==='history')return showHistory();if(action==='tokenSave'){state.token=el('token').value;toast('Token kept in current tab only.');return;}const t=tasks.find(x=>x.id===state.selected);if(!t)return;if(action==='export')return exportTask(t);if(action==='delete'&&confirm('Delete '+t.title+'? This cannot be undone.')){if(state.cloud){cloudRequest('/api/tasks/'+t.id,'DELETE').then(r=>{if(!r.deleted)throw Error('Task not deleted');tasks=tasks.filter(x=>x.id!==t.id);state.selected=null;render();toast('Task deleted.');}).catch(e=>toast(e.message));}else{tasks=tasks.filter(x=>x.id!==t.id);state.selected=null;save();render();toast('Task deleted.');}}});
fetch('/api/onepage/policy').then(r=>{if(!r.ok)throw Error('policy unavailable');return r.json();}).then(d=>{state.onepagePolicy=d.contract||null;render();}).catch(()=>{state.onepagePolicy=null;render();});
fetch('/api/status').then(r=>r.json()).then(d=>{state.ai=!!d.taskAiEnabled;state.cloud=!!d.cloudConfigured;el('aiPill').textContent=state.cloud?'Cloud workspace · sign in':'Local workspace';render();}).catch(()=>{el('aiPill').textContent='Server unavailable';});
render();
</script></body></html>
